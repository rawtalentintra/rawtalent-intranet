<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set up your password · RawTalent HeartBeat</title>
<style>html,body{background:#f4f6fb;margin:0;font-family:Inter,system-ui,sans-serif;color:#141b34}
.card{max-width:380px;margin:12vh auto;background:#fff;border-radius:14px;padding:28px;box-shadow:0 4px 24px rgba(20,27,52,.08)}
h1{font-size:20px;margin:0 0 6px}p{font-size:14px;color:#5a6280;margin:0 0 18px}label{font-size:13px;font-weight:600;display:block;margin:12px 0 4px}
input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #d5d9e6;border-radius:8px;font-size:15px}
button{margin-top:18px;width:100%;padding:11px;border:0;border-radius:8px;background:#141b34;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
#msg{margin-top:12px;font-size:13px;color:#c0392b;min-height:1em}</style></head><body>
<div class="card"><h1>Set up your HeartBeat password</h1><p>Choose a password (at least 10 characters). Then sign in with your email and this password.</p>
<form id="f">
<label>New password</label><input type="password" id="n1" autocomplete="new-password" required minlength="10">
<label>Confirm new password</label><input type="password" id="n2" autocomplete="new-password" required minlength="10">
<button>Save password</button><div id="msg"></div></form></div>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault(); const m = document.getElementById('msg');
  if (n1.value !== n2.value) { m.textContent = "The new passwords don't match."; return; }
  const r = await fetch('/auth/setup-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: new URLSearchParams(location.search).get('t'), password: n1.value }) });
  const d = await r.json().catch(() => ({}));
  if (r.ok) { m.style.color='#1e8449'; m.textContent='Saved. Taking you to sign in...'; setTimeout(()=>location.href='/login.html',1200); } else m.textContent = d.error || 'Something went wrong.';
};
</script></body></html>
