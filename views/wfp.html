<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>RawTalent HeartBeat</title>

  <link rel="manifest" href="/wfp/manifest.json">
  <meta name="theme-color" content="#0b1d3e">
  <!-- iOS Safari doesn't honor the manifest for install metadata — these
       three tags are still required for "Add to Home Screen" there. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RT HeartBeat">
  <link rel="apple-touch-icon" href="/wfp/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/wfp/icon-192.png">

  <style>
    :root {
      --navy: #0b1d3e;
      --navy-light: #132248;
      --blue: #3d6fff;
      --blue-bg: #eef2ff;
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #16213e;
      --text-muted: #6b7590;
      --border: #e2e6f0;
      --green: #15803d;
      --green-bg: #f0fdf4;
      --amber: #b45309;
      --amber-bg: #fff7ed;
      --red: #b91c1c;
      --red-bg: #fef2f2;
      --purple: #6d28d9;
      --purple-bg: #f3e8ff;
      --info: #0369a1;
      --info-bg: #e0f2fe;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
    a { color: inherit; }

    /* Fixed header/bottom-nav — CLAUDE.md GPU-compositor guidance: contain
       paint on any large fixed element, explicit background, no
       backdrop-filter/will-change/translateZ anywhere in this file. */
    header {
      position: sticky; top: 0; z-index: 10;
      background: var(--navy); color: white;
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
      contain: paint; transform-style: flat;
      display: flex; align-items: center; gap: 10px;
    }
    /* Today/Leads/Centres (Joy, 2026-09-03: "remove the Today section at
       the top... not needed") — the bottom nav already names the screen,
       so on those 3 top-level tabs the header collapses to just the
       safe-area strip instead of an empty navy bar with a redundant
       title. Sub-views (Lead/Centre Detail, Plan Route, Log Activity,
       etc.) still get their real title + back arrow at full height. */
    header.compact { padding-top: env(safe-area-inset-top); padding-bottom: 2px; }
    header h1 { font-size: 17px; font-weight: 700; margin: 0; flex: 1; }

    main { padding: 14px 14px 24px; max-width: 560px; margin: 0 auto; }

    nav.bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      background: var(--card); border-top: 1px solid var(--border);
      display: flex; padding-bottom: env(safe-area-inset-bottom);
      contain: paint; transform-style: flat;
    }
    nav.bottom-nav button {
      flex: 1; background: none; border: none; padding: 13px 4px;
      font-size: 14px; color: var(--blue); font-weight: 700; cursor: pointer;
    }

    .search-box {
      width: 100%; padding: 11px 14px; border: 1px solid var(--border);
      border-radius: 10px; font-size: 15px; background: var(--card); margin-bottom: 12px;
    }
    .toggle-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13.5px; color: var(--text-muted); }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 13px 15px; margin-bottom: 10px; cursor: pointer;
    }
    .card .name { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
    .card .sub { font-size: 13px; color: var(--text-muted); }
    .card .why { font-size: 12px; color: var(--text); margin-top: 4px; }
    .badge {
      display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px;
      border-radius: 20px; margin-top: 6px;
    }
    .badge.good { background: var(--green-bg); color: var(--green); }
    .badge.warn { background: var(--amber-bg); color: var(--amber); }
    .badge.bad { background: var(--red-bg); color: var(--red); }
    .badge.info { background: var(--info-bg); color: var(--info); }
    .badge.neutral { background: #eef1f8; color: var(--text-muted); }
    .badge.purple { background: var(--purple-bg); color: var(--purple); }
    .badge.inline { margin-top: 0; flex-shrink: 0; }
    /* Bottom-right corner badge (Today's Centre/Lead type tag, Leads
       list's stage tag) — Joy, 2026-09-06: smaller, tucked in the
       corner rather than sitting inline next to the title. */
    .card-corner-badge { display: flex; justify-content: flex-end; margin-top: 6px; }
    .badge.corner { margin-top: 0; font-size: 9.5px; padding: 1px 7px; }
    /* Single-colour health status square (Centre Detail + Centres List) —
       replaces a white card + badge + explanation text: "the fact that
       it's healthy describes it... we don't need it" (Liam, 2026-09-04). */
    .health-square {
      display: inline-block; font-size: 12.5px; font-weight: 700; padding: 6px 12px;
      border-radius: 8px; margin: 8px 0 0;
    }
    .health-square.good { background: var(--green); color: white; }
    .health-square.warn { background: var(--amber); color: white; }
    .health-square.bad { background: var(--red); color: white; }
    .health-square.info { background: var(--info); color: white; }
    .health-square.neutral { background: var(--text-muted); color: white; }
    /* Read-only favourite star (Educators) — Joy, 2026-09-04: "not
       editable", illuminated when favourited, empty outline when not. */
    .fav-star { font-size: 15px; color: #d1d5db; }
    .fav-star.on { color: #d97706; }

    .empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 14px; }
    .spinner-wrap { display: flex; justify-content: center; padding: 30px 0; }
    .spinner {
      width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--blue);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .section-title { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; margin: 18px 0 8px; }
    .stat-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .stat { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 8px; text-align: center; }
    .stat .num { font-size: 19px; font-weight: 800; color: var(--navy); }
    .stat .label { font-size: 10.5px; color: var(--text-muted); margin-top: 2px; }

    .action-row { display: flex; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
    .btn {
      flex: 1; padding: 11px 10px; border-radius: 10px; border: none; font-size: 13.5px;
      font-weight: 700; cursor: pointer; text-align: center; min-width: 90px;
      text-decoration: none; display: inline-block;
    }
    .btn-primary { background: var(--blue); color: white; }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: var(--red-bg); color: var(--red); border: 1px solid #fecaca; }
    .btn:disabled { opacity: 0.55; }

    /* Compact quick-action row on a card — Call/Directions/Log/Follow-up.
       Smaller than the full-size .btn row above, meant to sit inline on a
       list card without dominating it. */
    .quick-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .qa-btn {
      background: #eef1f8; color: var(--navy); border: none; border-radius: 8px;
      padding: 6px 9px; font-size: 11.5px; font-weight: 700; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
    }

    .educator-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .educator-row:last-child { border-bottom: none; }
    .educator-row .name { font-weight: 600; font-size: 14px; }
    .educator-row .meta { font-size: 12px; color: var(--text-muted); }
    .tag-chip { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 10px; margin-right: 4px; margin-top: 3px; }
    .tag-chip.favourite { background: #fef3c7; color: #92400e; }
    .tag-chip.known { background: #e0e7ff; color: #3730a3; }
    .show-more-btn { background: none; border: none; color: var(--blue); font-size: 13px; font-weight: 700; padding: 8px 0 2px; cursor: pointer; }
    .note-line { font-size: 12.5px; color: var(--text-muted); padding: 8px 0; }

    label { display: block; font-size: 12.5px; font-weight: 700; color: var(--text-muted); margin: 12px 0 5px; }
    input[type=text], input[type=date], input[type=time], input[type=tel], input[type=email], select, textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px;
      font-size: 15px; background: var(--card); font-family: inherit;
    }
    textarea { min-height: 70px; resize: vertical; }
    .field-hint { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
    /* Address autocomplete dropdown (Plan a Route's starting-address/
       manual-stop fields) — absolutely positioned so it overlays whatever
       comes next in the form instead of pushing it down. */
    .autocomplete-dropdown {
      position: absolute; left: 0; right: 0; top: 100%; z-index: 5;
      background: var(--card); border: 1px solid var(--border); border-radius: 9px;
      margin-top: 2px; overflow: hidden; contain: paint; transform-style: flat;
    }
    .autocomplete-item { padding: 10px 12px; font-size: 13.5px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .autocomplete-item:last-child { border-bottom: none; }
    label .optional { font-weight: 400; text-transform: none; letter-spacing: normal; color: var(--text-muted); }

    .toast {
      position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom));
      transform: translateX(-50%); background: var(--navy); color: white; padding: 10px 18px;
      border-radius: 20px; font-size: 13.5px; z-index: 100; opacity: 0; pointer-events: none;
      transition: opacity 0.2s; contain: paint; transform-style: flat;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: var(--red); }

    /* Recorder — one shared component (Leads + Centres) */
    .recorder-box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin: 10px 0; text-align: center; }
    .recorder-status { font-size: 12.5px; color: var(--text-muted); margin-top: 6px; }
    .rec-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-right: 5px; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.3; } }
  </style>
</head>
<body>
  <header>
    <div style="flex:1">
      <h1 id="headerTitle">Today</h1>
    </div>
  </header>

  <main id="mainContent"><div class="spinner-wrap"><div class="spinner"></div></div></main>

  <nav class="bottom-nav">
    <button id="navToday" class="active" onclick="setTab('today')">Today</button>
    <button id="navLeads" onclick="setTab('leads')">Leads</button>
    <button id="navCentres" onclick="setTab('centres')">Centres</button>
  </nav>

  <div class="toast" id="toast"></div>

  <script>
    // ── State ──────────────────────────────────────────────────────────
    let currentUser = null;
    let viewStack = ['today'];
    let allCentres = [];
    let allLeads = [];
    let dataLoadedAt = 0; // re-fetch leads/centres if it's been a while (someone else's edit, a new visit logged elsewhere)
    let currentCentreKey = null;
    let currentSnapshot = null;
    let currentLeadId = null;
    let currentLeadActivities = [];
    let currentLeadNotes = [];
    let activityTypes = { callTypes: [], visitTypes: [] };
    let wfpFilterLabel = null; // admin-only territory toggle — null = All States (see ensureDataLoaded)
    let logTarget = null; // { type: 'lead'|'centre', id, channel, prefillOutcome }
    let editingLeadId = null;
    let plannedRoute = null; // TODAY's saved wfp_planned_routes row (or null) — always today specifically, never whatever date is being browsed below. Still what "Along Your Route"/Rebuild-defaults/Add-to-Route-from-detail-pages read, since those are all genuinely about today.
    // "Your Route" section's own date-strip (Joy, 2026-09-06: "add the
    // dates bar there as well so that can select the specific date and
    // look at that route saved for that date") — separate from Plan
    // Route's identically-shaped state (routeBuilderDate/planRouteWeekStart)
    // on purpose: browsing a date here is just LOOKING, it shouldn't
    // change what Plan Route itself defaults to next time it's opened.
    let todayViewDate = null;
    let todayViewWeekStart = null;
    let todayViewedRoute = null; // the route being displayed for todayViewDate — plannedRoute itself when that's today, separately fetched otherwise
    let todayViewLoading = false;
    let routeBuilderDate = null;
    let planRouteWeekStart = null; // Monday of the week currently shown on the week-strip (see weekStripHtml)
    let planRouteLoadingDate = false; // true while selectRouteDate() is fetching a saved plan for the tapped date
    let routeBuilderStart = '';
    let routeBuilderDeparture = '';
    let routeBuilderTargetStops = 5; // "how many stops today?" (Joy, 2026-09-06) — a personal goal, not a hard cap (10 stays the real technical max)
    let routeBuilderStops = []; // [{type:'lead'|'centre', id, label} | {type:'manual', label, address}]
    let routeBuilderStartCoord = null; // {lat,lng} once the starting address resolves — gates + ranks Suggested Stops (see paintPlanRoute)
    let routeDraftPreview = null; // background, non-persisted preview of the optimized route so far (see refreshRouteDraftPreview)
    let routeReviewResult = null; // the just-built (and already-saved) route, shown on the Accept/Rebuild review screen

    function toast(msg, kind) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show' + (kind === 'error' ? ' error' : '');
      setTimeout(() => { el.className = 'toast'; }, 2400);
    }
    function escHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Every live-search box on this app (Today/Leads/Centres/Plan Route's
    // stop search) re-filters by calling its screen's paint function on
    // every keystroke, and that paint function does a full
    // `main.innerHTML = ...` — which destroys and recreates the search
    // input itself each time. A brand-new DOM node has no memory of focus
    // or cursor position, so every single keystroke silently dropped focus
    // (glitchy/impossible-to-type-in behaviour, found live 2026-09-04).
    // This wraps a paint call to snapshot the currently-focused input's id
    // + cursor position beforehand and restore both on the freshly
    // rebuilt element afterward — same input value, same effective typing
    // experience, just without losing your place after each character.
    function repaintKeepingFocus(paintFn) {
      const active = document.activeElement;
      const id = active && active.id;
      const selStart = active?.selectionStart;
      const selEnd = active?.selectionEnd;
      paintFn();
      if (!id) return;
      const el = document.getElementById(id);
      if (el && typeof el.focus === 'function') {
        el.focus();
        if (typeof selStart === 'number' && el.setSelectionRange) {
          try { el.setSelectionRange(selStart, selEnd); } catch {}
        }
      }
    }

    async function api(path, opts) {
      const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      try { return new Date(iso).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }); } catch { return iso; }
    }
    function fmtTime(iso) {
      try { return new Date(iso).toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' }); } catch { return ''; }
    }
    // Straight-line distance — good enough for "nearby", not a driving ETA.
    function haversineKm(lat1, lng1, lat2, lng2) {
      const R = 6371, toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }
    function phoneLink(phone, label) {
      return phone ? `<a href="tel:${escHtml(phone)}" style="text-decoration:none" onclick="event.stopPropagation()">${escHtml(label || phone)}</a>` : '';
    }
    function mailtoLink(email, label) {
      return email ? `<a href="mailto:${escHtml(email)}" onclick="event.stopPropagation()">${escHtml(label || email)}</a>` : '';
    }

    // ── Navigation ─────────────────────────────────────────────────────
    const TOP_LEVEL_TABS = ['today', 'leads', 'centres'];
    function setView(view, push = true) {
      if (push) viewStack.push(view);
      document.getElementById('navToday').classList.toggle('active', view === 'today');
      document.getElementById('navLeads').classList.toggle('active', view === 'leads' || view === 'lead-detail' || view === 'create-lead' || view === 'edit-lead');
      document.getElementById('navCentres').classList.toggle('active', view === 'centres' || view === 'centre-detail');
      document.querySelector('header').classList.toggle('compact', TOP_LEVEL_TABS.includes(view));
      render(view);
    }
    function goBack() {
      if (viewStack.length > 1) viewStack.pop();
      setView(viewStack[viewStack.length - 1], false);
    }
    // Bottom-nav taps — a real bug Liam spotted live (2026-09-03): tapping
    // Today/Leads/Centres called setView(view) with its default push=true,
    // so switching tabs kept growing viewStack instead of resetting it —
    // after a bit of normal use, viewStack.length was almost always > 1,
    // showing a back arrow on top-level tabs that should never have one
    // ("they know if they're on Centres, Leads, or Today because it'll be
    // lit up down the bottom"). Resets the stack to just this tab instead.
    function setTab(view) {
      viewStack = [view];
      setView(view, false);
    }

    function render(view) {
      const main = document.getElementById('mainContent');
      main.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';
      if (view === 'today') return renderToday();
      if (view === 'leads') return renderLeadsList();
      if (view === 'lead-detail') return renderLeadDetail();
      if (view === 'create-lead') return renderLeadForm(null);
      if (view === 'edit-lead') return renderLeadForm(editingLeadId);
      if (view === 'centres') return renderCentresList();
      if (view === 'centre-detail') return renderCentreDetail();
      if (view === 'log-activity') return renderLogActivity();
      if (view === 'plan-route') return renderPlanRoute();
      if (view === 'route-review') return renderRouteReview();
      if (view === 'route-stop-picker') return renderRouteStopPicker();
    }

    // ── Shared data load (Today/Leads/Centres all read the same two lists) ──
    // wfpFilterLabel is always kept as "whichever territory is active right
    // now" — defaulted to the caller's own wfpLabel at boot (init()), and
    // only ever changed via setWfpFilterLabel — so a plain ?partnerLabel=
    // covers every case (own territory, an admin/Liam's cross-territory
    // pick, or one of Gwen's two) with no separate ?mine=true special case
    // needed. Simplified 2026-09-03 while wiring up Gwen's second
    // territory (SA + QLD) — ?mine=true and ?partnerLabel=<own label>
    // were always equivalent server-side anyway (routes/leads.js|
    // centres.js's own targetLabel resolution).
    async function ensureDataLoaded(force) {
      if (!force && allLeads.length + allCentres.length && Date.now() - dataLoadedAt < 60000) return;
      // "For Test filter just put all territories please" (Joy,
      // 2026-09-06) — the You - Test sandbox label is a made-up string
      // that deliberately matches no real centre/lead assignment (see
      // testTerritoryLabel), so filtering the LIST by it always returned
      // zero results, defeating the point of using it to try out Plan
      // Route/Browse Centres & Leads. It still stays the real label used
      // for SAVING a test route (activeWfpLabelForPlanning, unchanged) —
      // only reading the full leads/centres list is treated as unfiltered
      // here, same as "All States".
      const isTestSandbox = currentUser && !currentUser.wfpLabel && wfpFilterLabel === testTerritoryLabel();
      const q = (wfpFilterLabel && !isTestSandbox) ? '?partnerLabel=' + encodeURIComponent(wfpFilterLabel) : '';
      try {
        const [leads, centres] = await Promise.all([api('/api/leads' + q), api('/api/centres' + q)]);
        allLeads = leads;
        allCentres = centres;
        dataLoadedAt = Date.now();
      } catch { toast('Could not load your leads/centres', 'error'); }
    }

    // ── Territory filter ─────────────────────────────────────────────
    // Corrected 2026-09-04 (Joy, direct): "their territories are already
    // pre-selected for them... for their own territories, they should
    // only see automatically filtered for their OWN territories only. For
    // Liam, Justine, and Gwen." — no per-account override, ever, even one
    // they personally hold. The ONE thing that decides which bar shows is
    // whether the account has a wfp_label at all:
    //  - NO wfp_label (Joy, or any other admin not personally tied to a
    //    territory) — "we should be able to see all their filters... so
    //    we can check accordingly per territory" — the full admin-style
    //    picker across every territory.
    //  - HAS a wfp_label — locked to just their own (+ additionalTerritories
    //    if set, e.g. Gwen: SA + QLD — still "their own", just two of
    //    them) — no cross-territory picker, full stop.
    const WFP_FILTER_OPTIONS = [
      { key: '', label: 'All States', bg: '#0b1d3e' },
      { key: 'Liam Baxter (VIC)', label: 'Liam - VIC', bg: '#2563eb' },
      { key: 'Justine Hardware (VIC)', label: 'Justine - VIC', bg: '#0d9488' },
      { key: 'Gwen Stocks (SA)', label: 'Gwen - SA', bg: '#db2777' },
      { key: 'Gwen Stocks (QLD)', label: 'Gwen - QLD', bg: '#f97316' }
    ];
    function shortFilterLabel(fullLabel) {
      const known = WFP_FILTER_OPTIONS.find(o => o.key === fullLabel);
      return known ? known.label : fullLabel;
    }
    // A no-wfp_label account (Joy, or any other admin — but NOT Liam,
    // Justine or Gwen, who are each locked to their own real territory
    // with no picker at all, 2026-09-06) gets the full real-territory
    // list PLUS a synthetic "You - Test" option. It resolves to a made-up
    // label unique to the logged-in admin (never matches any real
    // suburb/state assignment), so tapping it is a safe, isolated
    // sandbox — no real centre, lead or route ever lands there, and two
    // different admins testing at once don't collide with each other.
    function testTerritoryLabel() {
      return `Test — ${currentUser.name || currentUser.email}`;
    }
    function wfpFilterOptionsForCurrentUser() {
      if (!currentUser.wfpLabel) {
        return [...WFP_FILTER_OPTIONS, { key: testTerritoryLabel(), label: 'You - Test', bg: '#6b7280' }];
      }
      if (currentUser.additionalTerritories?.length) {
        const own = WFP_FILTER_OPTIONS.find(o => o.key === currentUser.wfpLabel) || { key: currentUser.wfpLabel, label: shortFilterLabel(currentUser.wfpLabel), bg: '#0b1d3e' };
        const extra = currentUser.additionalTerritories.map(label => WFP_FILTER_OPTIONS.find(o => o.key === label) || { key: label, label: shortFilterLabel(label), bg: '#6b7590' });
        return [own, ...extra];
      }
      return null;
    }
    function wfpFilterBarHtml() {
      const options = wfpFilterOptionsForCurrentUser();
      if (!options) return '';
      return `<div style="display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px">
        ${options.map(o => `
          <button onclick="setWfpFilterLabel('${o.key.replace(/'/g, "\\'")}')" style="flex-shrink:0;border:none;border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;background:${o.bg};color:white;opacity:${wfpFilterLabel === o.key ? '1' : '.55'}">${escHtml(o.label)}</button>
        `).join('')}
      </div>`;
    }
    async function setWfpFilterLabel(label) {
      wfpFilterLabel = label || null;
      await ensureDataLoaded(true);
      render(viewStack[viewStack.length - 1]);
    }
    // Which territory a save/read of a mobile route plan is for — always
    // just the active filter (see ensureDataLoaded's own comment on why
    // wfpFilterLabel alone is now the single source of truth).
    function activeWfpLabelForPlanning() {
      return wfpFilterLabel || null;
    }

    // ── Lead stage (derived — no dedicated DB field, see db/schema.sql's
    // own comment on why leads only carry 3 status/date pairs) ──────────
    const LEAD_STAGE_META = {
      new: { label: 'New', cls: 'neutral' },
      contacted: { label: 'Contacted', cls: 'neutral' },
      visit_scheduled: { label: 'Visit Scheduled', cls: 'warn' },
      visited: { label: 'Visited', cls: 'warn' },
      signed: { label: 'Signed', cls: 'good' },
      closed_lost: { label: 'Closed / Lost', cls: 'bad' }
    };
    function deriveLeadStage(l) {
      if (l.closed_at && l.signed_status !== 'signed') return 'closed_lost';
      if (l.signed_status === 'signed') return 'signed';
      if (l.centre_visited_status === 'done') return 'visited';
      if (l.centre_visited_status === 'scheduled') return 'visit_scheduled';
      if (l.lead_called_status === 'done') return 'contacted';
      return 'new';
    }

    // ── Priority (Joy's 8-tier list, 2026-09-03 call follow-up) ─────────
    // Tier 1 of Today's "Needs Attention" list — a centre that just
    // converted its first booking and has never been visited. Didn't exist
    // anywhere in the app before ("I don't have that yet. Let me add
    // that." — Joy, on an earlier call); derived entirely from fields
    // GET /api/centres already returns, no schema/backend change.
    function needsFirstBookingVisit(c) {
      return c.bookings90dCount === 1 && !c.nurture?.lastContactDate;
    }

    // ── Today ──────────────────────────────────────────────────────────
    let todaySearchVal = '';
    function todayDateStr(d) {
      const dt = d || new Date();
      return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
    }
    // Small date-string helpers for the Plan Route week-strip — everything
    // here works in LOCAL calendar days (no timezone math), same as
    // todayDateStr above, since a route date is a calendar day, not an
    // instant.
    function dateStrToDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    }
    function dateStrAdd(dateStr, days) {
      const dt = dateStrToDate(dateStr);
      dt.setDate(dt.getDate() + days);
      return todayDateStr(dt);
    }
    // Monday on/before dateStr — getDay() is 0=Sunday..6=Saturday, so the
    // offset back to Monday is 0 for Monday itself and 6 for Sunday.
    function mondayOf(dateStr) {
      const dt = dateStrToDate(dateStr);
      const offset = (dt.getDay() + 6) % 7;
      return dateStrAdd(dateStr, -offset);
    }
    async function renderToday() {
      document.getElementById('headerTitle').textContent = '';
      await ensureDataLoaded();
      plannedRoute = null;
      const targetLabel = activeWfpLabelForPlanning();
      if (targetLabel) {
        try {
          const q = '?date=' + todayDateStr() + '&wfpLabel=' + encodeURIComponent(targetLabel);
          const res = await api('/api/route-planner/mobile-plan' + q);
          plannedRoute = res.plan;
        } catch { plannedRoute = null; }
      }
      // Always resets back to today's own week whenever Today is (re)opened
      // — browsing to a different date on a previous visit shouldn't leave
      // you stranded there next time you land on this tab.
      todayViewDate = todayDateStr();
      todayViewWeekStart = mondayOf(todayViewDate);
      todayViewedRoute = plannedRoute;
      paintToday();
    }
    function shiftTodayViewWeek(days) {
      todayViewWeekStart = dateStrAdd(todayViewWeekStart, days);
      paintToday();
    }
    // Tapping a date on Today's own strip — pure viewing, never touches
    // Plan Route's state. Today's real data (plannedRoute) is reused with
    // no extra fetch when the date IS today; any other date does the same
    // GET /mobile-plan lookup Plan Route's selectRouteDate already does.
    async function selectTodayViewDate(dateStr) {
      todayViewDate = dateStr;
      if (dateStr < todayViewWeekStart || dateStr > dateStrAdd(todayViewWeekStart, 6)) todayViewWeekStart = mondayOf(dateStr);
      if (dateStr === todayDateStr()) { todayViewedRoute = plannedRoute; paintToday(); return; }
      const targetLabel = activeWfpLabelForPlanning();
      if (!targetLabel) { todayViewedRoute = null; paintToday(); return; }
      todayViewLoading = true;
      paintToday();
      try {
        const res = await api(`/api/route-planner/mobile-plan?date=${dateStr}&wfpLabel=${encodeURIComponent(targetLabel)}`);
        todayViewedRoute = res.plan;
      } catch { todayViewedRoute = null; }
      finally { todayViewLoading = false; paintToday(); }
    }

    // Leads/centres within ~5km of any stop in today's planned route — the
    // route-based "nearby" Joy asked for, replacing live-GPS nearby when a
    // route exists (a route stop's location is a much stronger "you'll be
    // near this" signal than the WFP's current live position, which mostly
    // just reflects wherever they happened to open the app).
    function itemsAlongPlannedRoute() {
      if (!plannedRoute?.stops?.length) return [];
      const routeStops = plannedRoute.stops.filter(s => Number.isFinite(s.latitude) && Number.isFinite(s.longitude));
      if (!routeStops.length) return [];
      const routeStopIds = new Set(plannedRoute.stops.map(s => s.id));
      const candidates = [
        ...allLeads.filter(l => !l.closed_at && !routeStopIds.has(l.id) && Number.isFinite(l.latitude)).map(l => ({ kind: 'lead', lead: l, label: l.centre_name })),
        ...allCentres.filter(c => !routeStopIds.has(c.centreKey) && Number.isFinite(c.latitude)).map(c => ({ kind: 'centre', centre: c }))
      ];
      return candidates
        .map(item => {
          const obj = item.kind === 'lead' ? item.lead : item.centre;
          const dist = Math.min(...routeStops.map(s => haversineKm(obj.latitude, obj.longitude, s.latitude, s.longitude)));
          return { ...item, _alongRoute: true, _distanceKm: dist };
        })
        .filter(item => item._distanceKm <= 5)
        .sort((a, b) => a._distanceKm - b._distanceKm)
        .slice(0, 10);
    }

    // ── Plan a Route ─────────────────────────────────────────────────
    // "They should just be able to enter a starting address and either
    // select a centre for their destination, select a lead, or enter an
    // address/suburb manually. Don't make it complicated." — Joy, verbatim.
    // `dateStr` lets a caller open Plan Route already pointed at a
    // specific day (Today's own date-strip's "Plan Route"/"Build Route
    // around it"/"Rebuild Route" buttons for a non-today date) — defaults
    // to today, unchanged, for every other existing call site.
    function openPlanRoute(dateStr) {
      const targetDate = dateStr || todayDateStr();
      routeBuilderDate = targetDate;
      planRouteWeekStart = mondayOf(targetDate);
      routeBuilderDeparture = '09:00';
      routeBuilderTargetStops = 5;
      routeBuilderStartCoord = null;
      if (targetDate !== todayDateStr()) {
        // Not today — hand off entirely to selectRouteDate, the exact
        // same lookup tapping this date on the strip itself would do
        // (fetches whatever's really saved for it, or blanks out with the
        // same Home Address fallback, rather than duplicating that logic
        // here against the wrong day's data). Returns its promise so a
        // caller that needs to add a stop AFTER this resolves (e.g.
        // buildRouteAroundScheduledVisit) can await it instead of racing
        // the fetch.
        routeBuilderStops = [];
        routeBuilderStart = '';
        setView('plan-route');
        return selectRouteDate(targetDate);
      }
      routeBuilderStops = (plannedRoute?.stops || []).map(s => ({
        type: s.type, id: s.type !== 'manual' ? s.id : undefined, label: s.centre_name, address: s.type === 'manual' ? s.centre_name : undefined
      }));
      if (plannedRoute?.startAddress) {
        // Rebuilding an existing route — its own start address wins over
        // Home (they already told us where this particular day starts).
        routeBuilderStart = plannedRoute.startAddress;
      } else if (currentUser.homeAddress) {
        // "That's always going to be the starting point 90% of the time...
        // make it smart" — Joy, 2026-09-04. Pre-fills from the saved Home
        // Address (see saveHomeAddress()) on a genuinely fresh route —
        // still just a default, not locked: they can type over it same as
        // any other starting address.
        routeBuilderStart = currentUser.homeAddress;
        if (currentUser.homeLat != null && currentUser.homeLng != null) routeBuilderStartCoord = { lat: currentUser.homeLat, lng: currentUser.homeLng };
      } else {
        routeBuilderStart = '';
      }
      setView('plan-route');
      // Resolve a coordinate in the background whenever we have address
      // TEXT but no cached coordinate yet (a rebuild's own start address,
      // or a Home Address saved before its lat/lng ever resolved) — lets
      // Suggested Stops rank by proximity right away instead of waiting
      // for the WFP to retype/reselect an address already on file.
      if (routeBuilderStart && !routeBuilderStartCoord) resolveStartCoordIfNeeded();
      // Stops can already be pre-populated here too (rebuilding an
      // existing route, or handed off from Today's "Add to Route" with no
      // route yet) — kick off an initial draft rather than waiting for
      // the WFP to add/remove something before ever seeing one.
      else if (routeBuilderStops.length) refreshRouteDraftPreview();
    }
    function hhmmFromIso(iso) {
      try { const d = new Date(iso); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
      catch { return '09:00'; }
    }
    // Custom Hour / Minute(10s) / AM-PM dropdowns for Departure time —
    // replaces the native <input type=time> (Joy, 2026-09-06: "very
    // difficult to select the minutes... let's do it per ten minutes and
    // make it easy to select"). A `step` attribute on the native input
    // only ever hints at a minute increment — how (or whether) a given
    // browser's own wheel picker actually honours it isn't guaranteed, so
    // three plain <select>s guarantee exactly 6 minute options everywhere,
    // no native picker quirks to work around.
    const MINUTE_OPTIONS = ['00', '10', '20', '30', '40', '50'];
    function timePartsFromHHMM(hhmm) {
      const [h, m] = (hhmm || '09:00').split(':').map(Number);
      const ampm = h >= 12 ? 'PM' : 'AM';
      let hour12 = h % 12; if (hour12 === 0) hour12 = 12;
      const roundedMin = MINUTE_OPTIONS[Math.round(m / 10) % 6];
      return { hour12, minute: roundedMin, ampm };
    }
    function setDepartureFromParts() {
      const hour12 = Number(document.getElementById('routeDepHour').value);
      const minute = document.getElementById('routeDepMinute').value;
      const ampm = document.getElementById('routeDepAmPm').value;
      let hour24 = hour12 % 12; if (ampm === 'PM') hour24 += 12;
      routeBuilderDeparture = String(hour24).padStart(2, '0') + ':' + minute;
      refreshRouteDraftPreview();
    }
    function departureTimePickerHtml() {
      const { hour12, minute, ampm } = timePartsFromHHMM(routeBuilderDeparture);
      const hourOpts = Array.from({ length: 12 }, (_, i) => i + 1);
      return `
        <div style="display:flex;gap:8px">
          <select id="routeDepHour" style="flex:1" onchange="setDepartureFromParts()">
            ${hourOpts.map(h => `<option value="${h}" ${h === hour12 ? 'selected' : ''}>${h}</option>`).join('')}
          </select>
          <select id="routeDepMinute" style="flex:1" onchange="setDepartureFromParts()">
            ${MINUTE_OPTIONS.map(m => `<option value="${m}" ${m === minute ? 'selected' : ''}>${m}</option>`).join('')}
          </select>
          <select id="routeDepAmPm" style="flex:1" onchange="setDepartureFromParts()">
            <option value="AM" ${ampm === 'AM' ? 'selected' : ''}>AM</option>
            <option value="PM" ${ampm === 'PM' ? 'selected' : ''}>PM</option>
          </select>
        </div>
      `;
    }
    const WEEKDAY_ABBR = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    // "It just doesn't show the date today, but the dates for the whole
    // week clickable in one row of boxes... if it's selected, highlight it
    // blue... a month view when they tap on the month which will be a
    // separate row at the top... forward and back simple arrows to go to
    // the following week" — Joy, 2026-09-06. Replaces the old plain
    // <input type=date>. The arrows only move planRouteWeekStart (which
    // week is on screen) — they never change routeBuilderDate on their
    // own, only tapping a day box does that (via selectRouteDate).
    // Generalized so both Plan Route and Today's own "Your Route" section
    // can use the identical strip against their own independent state
    // (selectedDate/weekStart/onSelect-fn-name/onShift-fn-name) — Joy,
    // 2026-09-06, adding the same strip to Today: "select the specific
    // date and look at that route saved for that date."
    function weekStripHtml(selectedDate, weekStart, selectFn, shiftFn) {
      const days = Array.from({ length: 7 }, (_, i) => dateStrAdd(weekStart, i));
      const monthLabel = MONTH_NAMES[dateStrToDate(weekStart).getMonth()] + ' ' + dateStrToDate(weekStart).getFullYear();
      return `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <button class="qa-btn" onclick="${shiftFn}(-7)">&larr;</button>
          <div style="font-weight:700;font-size:13.5px">${escHtml(monthLabel)}</div>
          <button class="qa-btn" onclick="${shiftFn}(7)">&rarr;</button>
        </div>
        <div style="display:flex;gap:5px;margin-bottom:14px">
          ${days.map(d => {
            const dt = dateStrToDate(d);
            const isSelected = d === selectedDate;
            return `<button onclick="${selectFn}('${d}')" style="flex:1;border:none;border-radius:10px;padding:8px 2px;cursor:pointer;background:${isSelected ? 'var(--blue)' : 'var(--card)'};color:${isSelected ? 'white' : 'var(--text)'};border:1px solid ${isSelected ? 'var(--blue)' : 'var(--border)'}">
              <div style="font-size:10.5px;font-weight:700;opacity:.8">${WEEKDAY_ABBR[dt.getDay()]}</div>
              <div style="font-size:15px;font-weight:800;margin-top:2px">${dt.getDate()}</div>
            </button>`;
          }).join('')}
        </div>
      `;
    }
    function shiftPlanRouteWeek(days) {
      planRouteWeekStart = dateStrAdd(planRouteWeekStart, days);
      paintPlanRoute();
    }
    function setTargetStops(n) {
      routeBuilderTargetStops = n;
      paintPlanRoute();
    }
    // Tapping a day on the strip — loads whatever's already saved for that
    // date (see routes/routePlanner.js's GET /mobile-plan, already
    // date-parameterized; the gap was always the frontend never calling it
    // for anything but "today"), or resets to a blank slate if nothing's
    // been built yet for that day. Either way the existing Rebuild/Build/
    // Accept flow just works from here on — Build My Route always saves to
    // whatever routeBuilderDate currently is.
    async function selectRouteDate(dateStr) {
      routeBuilderDate = dateStr;
      if (dateStr < planRouteWeekStart || dateStr > dateStrAdd(planRouteWeekStart, 6)) planRouteWeekStart = mondayOf(dateStr);
      const targetLabel = activeWfpLabelForPlanning();
      if (!targetLabel) { paintPlanRoute(); return; }
      planRouteLoadingDate = true;
      paintPlanRoute();
      try {
        const res = await api(`/api/route-planner/mobile-plan?date=${dateStr}&wfpLabel=${encodeURIComponent(targetLabel)}`);
        const plan = res.plan;
        if (plan) {
          routeBuilderStart = plan.startAddress || '';
          routeBuilderStartCoord = null;
          routeBuilderDeparture = hhmmFromIso(plan.departureTime);
          routeBuilderStops = (plan.stops || []).map(s => ({
            type: s.type, id: s.type !== 'manual' ? s.id : undefined, label: s.centre_name, address: s.type === 'manual' ? s.centre_name : undefined
          }));
          routeDraftPreview = { itinerary: plan.itinerary, stops: plan.stops };
          if (routeBuilderStart) resolveStartCoordIfNeeded();
        } else {
          routeBuilderStops = [];
          routeDraftPreview = null;
          // Only fall back to Home Address on a genuinely blank field —
          // don't clobber a start address they're already using for
          // another date in this same session.
          if (!routeBuilderStart.trim() && currentUser.homeAddress) {
            routeBuilderStart = currentUser.homeAddress;
            routeBuilderStartCoord = (currentUser.homeLat != null && currentUser.homeLng != null) ? { lat: currentUser.homeLat, lng: currentUser.homeLng } : null;
          }
        }
      } catch { /* best-effort — leave whatever was already on screen */ }
      finally { planRouteLoadingDate = false; paintPlanRoute(); }
    }
    async function renderPlanRoute() {
      document.getElementById('headerTitle').textContent = 'Plan Route';
      await ensureDataLoaded();
      paintPlanRoute();
    }
    // Every known coordinate the route currently has to work with — the
    // starting address plus whichever already-added stops are real
    // (resolvable) leads/centres. Manual stops aren't included (their
    // coordinate is only ever resolved server-side, at Build/Preview
    // time) — a small, acceptable gap since most days lean on real
    // leads/centres, not typed addresses.
    // Real (resolvable) added stops only — no start address. Split out
    // from routeReferenceCoords below so the "exactly one destination"
    // detour-cost ranking (paintPlanRoute's Suggested Stops) can tell "no
    // stops yet" apart from "exactly one" apart from "several", not just
    // get one flat combined list.
    function addedStopCoords() {
      const points = [];
      for (const s of routeBuilderStops) {
        if (s.type === 'centre') {
          const c = allCentres.find(x => x.centreKey === s.id);
          if (c && Number.isFinite(c.latitude)) points.push({ lat: c.latitude, lng: c.longitude });
        } else if (s.type === 'lead') {
          const l = allLeads.find(x => x.id === s.id);
          if (l && Number.isFinite(l.latitude)) points.push({ lat: l.latitude, lng: l.longitude });
        }
      }
      return points;
    }
    function routeReferenceCoords() {
      const points = [];
      if (routeBuilderStartCoord) points.push(routeBuilderStartCoord);
      return points.concat(addedStopCoords());
    }

    // Shared block-rendering for any computed itinerary — Your Route
    // Today, the post-Build Route Preview screen, and the live in-progress
    // draft below — so all three read identically. `showLogButton` is
    // Your Route Today only (a draft/preview stop isn't something to log
    // against in the same immediate sense, even though it points at a
    // real lead/centre).
    function itineraryBlocksHtml(blocks, { showLogButton = false } = {}) {
      return (blocks || []).map(b => {
        if (b.type === 'lunch') return `<div class="note-line">${escHtml(b.label)} — ${fmtTime(b.start)}–${fmtTime(b.end)}</div>`;
        if (b.type === 'drive') return `<div class="note-line">${b.minutes != null ? Math.round(b.minutes) + ' min' : 'Drive'}${b.km != null ? ' (' + b.km.toFixed(1) + ' km)' : ''} to ${escHtml(b.to)}</div>`;
        const stop = b.stop;
        const isReal = stop.type === 'lead' || stop.type === 'centre';
        const address = [stop.street_address, stop.suburb, stop.state].filter(Boolean).join(', ');
        return `
          <div class="card" style="cursor:default">
            <div class="name">${fmtTime(b.start)}–${fmtTime(b.end)} · ${escHtml(stop.centre_name)}</div>
            ${address ? `<div class="sub">${escHtml(address)}</div>` : ''}
            ${showLogButton && isReal ? `<div class="quick-actions"><button class="qa-btn" onclick="openLogActivityFor('${stop.type}','${stop.id}')">Log</button></div>` : ''}
          </div>`;
      }).join('');
    }

    // A single Google Maps multi-stop directions link — "the whole route
    // should be seen on their Maps app... have the route plotted there
    // already" (Joy, 2026-09-04). Same URL shape Desktop's Smart Routing
    // uses (openRouteInGoogleMaps in views/admin.html) — one origin, one
    // destination (the last stop), everything in between as `waypoints`,
    // so the entire day opens as one plotted route instead of a separate
    // point-to-point link per stop.
    //
    // Each point is the actual NAME + ADDRESS text, not a raw "lat,lng"
    // pair — Joy, 2026-09-06: "it just says Dropped pin... is there no way
    // to actually map the actual location name, address." Google Maps
    // geocodes a real address/name string into the real place (shown with
    // its actual name); a bare coordinate pair only ever drops an
    // anonymous pin, even though the coordinate is technically accurate.
    // Falls back to the raw coordinate only when a stop genuinely has no
    // address/name text to give it (shouldn't happen in practice — every
    // resolved stop shape carries at least centre_name).
    function stopMapsQuery(s) {
      const address = [s.street_address, s.suburb, s.state].filter(Boolean).join(', ');
      const text = [s.centre_name, address].filter(Boolean).join(', ');
      if (text) return encodeURIComponent(text);
      if (Number.isFinite(s.latitude) && Number.isFinite(s.longitude)) return `${s.latitude},${s.longitude}`;
      return null;
    }
    function routeMapsUrl(startAddress, stops) {
      const withQuery = (stops || []).map(s => stopMapsQuery(s)).filter(Boolean);
      if (!withQuery.length) return null;
      const origin = encodeURIComponent(startAddress || '');
      const destination = withQuery[withQuery.length - 1];
      const waypoints = withQuery.slice(0, -1).join('|');
      let url = `https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=${origin}&destination=${destination}`;
      if (waypoints) url += `&waypoints=${waypoints}`;
      return url;
    }

    // "It should ideally be already building a rough draft of their route
    // for the day even before being able to click Build My Route" — Joy,
    // 2026-09-04. Calls the non-persisting /preview endpoint (same
    // resolve→optimize pipeline as the real Build, just nothing saved)
    // after every stop add/remove and whenever the start address resolves
    // — see the call sites in addRouteStop/removeRouteStop/
    // addManualRouteStop/resolveStartCoordIfNeeded/selectAddressSuggestion/
    // useHomeAddress. Best-effort and silent: a draft that fails to
    // compute (address not ready, departure time blank) just clears
    // itself rather than showing an error for what was never an explicit
    // user action.
    async function refreshRouteDraftPreview() {
      if (!routeBuilderStart.trim() || !routeBuilderStops.length) { routeDraftPreview = null; if (viewStack[viewStack.length - 1] === 'plan-route') paintPlanRoute(); return; }
      const departureTime = new Date(`${routeBuilderDate}T${routeBuilderDeparture || '09:00'}:00`).toISOString();
      try {
        const res = await api('/api/route-planner/preview', {
          method: 'POST',
          body: JSON.stringify({
            startAddress: routeBuilderStart, departureTime,
            stops: routeBuilderStops.map(s => s.type === 'manual' ? { type: 'manual', label: s.label, address: s.address } : { type: s.type, id: s.id })
          })
        });
        routeDraftPreview = res.itinerary ? res : null;
      } catch { routeDraftPreview = null; }
      if (viewStack[viewStack.length - 1] === 'plan-route') paintPlanRoute();
    }

    function paintPlanRoute() {
      const main = document.getElementById('mainContent');
      // Raw (original-cased) text kept for the input's own value — this
      // field had NO value= attribute at all until 2026-09-04, so every
      // repaint (i.e. every keystroke) silently wiped whatever had been
      // typed, on top of the separate focus-loss bug repaintKeepingFocus
      // above fixes.
      const rawStopSearch = document.getElementById('routeStopSearch')?.value || '';
      const q = rawStopSearch.toLowerCase().trim();
      const matches = q ? [
        ...allLeads.filter(l => !l.closed_at && !routeBuilderStops.some(s => s.type === 'lead' && s.id === l.id) && ((l.centre_name || '').toLowerCase().includes(q) || (l.suburb || '').toLowerCase().includes(q))).slice(0, 6).map(l => ({ type: 'lead', id: l.id, label: l.centre_name + (l.suburb ? ' — ' + l.suburb : '') })),
        ...allCentres.filter(c => !routeBuilderStops.some(s => s.type === 'centre' && s.id === c.centreKey) && ((c.name || '').toLowerCase().includes(q) || (c.suburb || '').toLowerCase().includes(q))).slice(0, 6).map(c => ({ type: 'centre', id: c.centreKey, label: c.name + (c.suburb ? ' — ' + c.suburb : '') }))
      ] : [];
      // "Why do they have to manually add stops when the goal is to build
      // the route" — Joy, 2026-09-03. The obvious candidates (Today's own
      // Needs Attention centres) now show as one-tap suggestions here too,
      // so typing a search is only needed for anything else — same
      // underlying list Today itself uses (todayBuckets), just re-filtered
      // to what isn't already on the stop list.
      // Gated on a resolved starting address, and ranked by ROUTING as well
      // as PRIORITISATION (the same tier order Needs Attention already
      // uses) — Joy, 2026-09-04: suggestions "should make sense in terms
      // of routing and prioritisation", and should "also improve based on
      // the selected centres or leads that are close to" — so proximity
      // isn't just measured from the start address, it's the distance to
      // the NEAREST of (start address + every stop already added), via
      // routeReferenceCoords(). Tier stays the primary sort (an urgent
      // tier-1 centre isn't buried under a merely-nearby tier-3 one);
      // distance only breaks ties within a tier.
      //
      // "It looks like it's best to just select the starting address and
      // ONE destination and then there should be suggestions... in between
      // or close" — Joy, 2026-09-06. With exactly one real stop added
      // (their one destination), ranking switches from "nearest to start"
      // to a detour-cost metric: dist(start→C) + dist(C→destination) −
      // dist(start→destination) — the standard "how much extra driving
      // does inserting C between these two points actually cost" measure,
      // so a centre genuinely ON THE WAY ranks above one that's merely
      // close to the start but off to one side. Falls back to the simpler
      // nearest-any-reference-point measure once 0 or 2+ stops are added —
      // a real "between all of them" corridor isn't well-defined once the
      // route has more than one destination and isn't worth the added
      // complexity here.
      const refCoords = routeReferenceCoords();
      const addedCoords = addedStopCoords();
      const isDetourMode = refCoords.length === 2 && addedCoords.length === 1;
      const distanceForCandidate = isDetourMode
        ? (lat, lng) => {
            const start = routeBuilderStartCoord, dest = addedCoords[0];
            const direct = haversineKm(start.lat, start.lng, dest.lat, dest.lng);
            return haversineKm(start.lat, start.lng, lat, lng) + haversineKm(lat, lng, dest.lat, dest.lng) - direct;
          }
        : (lat, lng) => Math.min(...refCoords.map(p => haversineKm(p.lat, p.lng, lat, lng)));
      // Capped to however many more stops are needed to hit today's target
      // (min 3, so there's always a real choice even right at the goal) —
      // no point suggesting 8 more once they've already said "just 3
      // today".
      const suggestedCap = Math.max(3, routeBuilderTargetStops - routeBuilderStops.length);
      const suggested = refCoords.length
        ? todayBuckets().attention
            .filter(item => !routeBuilderStops.some(s => s.type === 'centre' && s.id === item.centre.centreKey) && Number.isFinite(item.centre.latitude))
            .map(item => ({ ...item, _distanceKm: distanceForCandidate(item.centre.latitude, item.centre.longitude) }))
            .sort((a, b) => (a._tier - b._tier) || (a._distanceKm - b._distanceKm))
            .slice(0, suggestedCap)
        : [];

      // Always visible regardless of whether Starting Address currently
      // holds anything — "show that home button to everyone else too,
      // including myself" (Joy, 2026-09-04): the button only ever showing
      // once text was typed meant an admin/Joy landing on a blank field
      // (nobody auto-fills them — they have no personal territory to
      // default from) never saw it at all. Every account gets some
      // Home-Address affordance here now, in whichever of these 4 states
      // actually applies.
      const typedVal = routeBuilderStart.trim();
      const savedHome = (currentUser.homeAddress || '').trim();
      let homeUiHtml;
      if (typedVal && typedVal === savedHome) {
        homeUiHtml = `<div class="field-hint">This is your Home Address</div>`;
      } else if (typedVal) {
        homeUiHtml = `<div class="action-row" style="margin-top:2px">
          <button class="qa-btn" onclick="saveHomeAddress()">Save as Home Address</button>
          ${savedHome ? `<button class="qa-btn" onclick="useHomeAddress()">Use Home Address</button>` : ''}
        </div>`;
      } else if (savedHome) {
        homeUiHtml = `<button class="qa-btn" style="margin-top:2px" onclick="useHomeAddress()">Use Home Address (${escHtml(savedHome)})</button>`;
      } else {
        homeUiHtml = `<div class="field-hint">No Home Address saved yet — enter one above, then tap Save.</div>`;
      }

      // "Notified when planning routes" (Joy, 2026-09-06) — a confirmed
      // visit for whichever day is on screen, not yet on this route.
      // Reuses addRouteStop, same as Suggested Stops' own one-tap add.
      const scheduledForThisDay = scheduledVisitItemsForDate(
        routeBuilderDate,
        routeBuilderStops.filter(s => s.type === 'centre').map(s => s.id),
        routeBuilderStops.filter(s => s.type === 'lead').map(s => s.id)
      );

      main.innerHTML = `
        ${wfpFilterBarHtml()}
        ${weekStripHtml(routeBuilderDate, planRouteWeekStart, 'selectRouteDate', 'shiftPlanRouteWeek')}
        ${planRouteLoadingDate ? `<div class="field-hint" style="margin-bottom:10px">Loading…</div>` : ''}
        ${scheduledForThisDay.length ? `
        <div class="section-title">Confirmed for This Day</div>
        ${scheduledForThisDay.map(item => {
          const name = item.kind === 'lead' ? item.lead.centre_name : item.centre.name;
          const id = item.kind === 'lead' ? item.lead.id : item.centre.centreKey;
          return `
          <div class="card" onclick="addRouteStop('${item.kind}','${id}')">
            <div class="name">${escHtml(name)}</div>
            <div class="sub">Visit already confirmed — tap to add to this route</div>
          </div>`;
        }).join('')}
        ` : ''}
        <label>Starting address</label>
        <div style="position:relative">
          <input type="text" id="routeStartInput" placeholder="Where are you starting from?" value="${escHtml(routeBuilderStart)}" oninput="onAddressAutocompleteInput('routeStartInput','routeStartSuggestions')" onblur="setTimeout(()=>{document.getElementById('routeStartSuggestions').innerHTML='';resolveStartCoordIfNeeded();},150)">
          <div id="routeStartSuggestions" class="autocomplete-dropdown"></div>
        </div>
        ${homeUiHtml}
        <label>Departure time</label>
        ${departureTimePickerHtml()}

        <label>How many stops would you like to do today?</label>
        <div style="display:flex;gap:6px;margin-bottom:4px">
          ${[3, 5, 8, 10].map(n => `<button onclick="setTargetStops(${n})" style="flex:1;border:none;border-radius:10px;padding:9px 4px;font-weight:700;cursor:pointer;background:${routeBuilderTargetStops === n ? 'var(--blue)' : 'var(--card)'};color:${routeBuilderTargetStops === n ? 'white' : 'var(--text)'};border:1px solid ${routeBuilderTargetStops === n ? 'var(--blue)' : 'var(--border)'}">${n}</button>`).join('')}
        </div>

        <div class="section-title">Stops (${routeBuilderStops.length}/${10})</div>
        <div class="field-hint" style="margin-bottom:8px">${routeBuilderStops.length >= routeBuilderTargetStops ? `You've reached your ${routeBuilderTargetStops}-stop goal for today.` : `Aiming for ${routeBuilderTargetStops} stops today — ${routeBuilderTargetStops - routeBuilderStops.length} to go.`}</div>
        ${routeBuilderStops.length ? routeBuilderStops.map((s, i) => `
          <div class="card" style="cursor:default;display:flex;justify-content:space-between;align-items:center;gap:8px">
            <div><div class="name">${escHtml(s.label)}</div><div class="sub">${s.type === 'manual' ? 'Manual address' : (s.type === 'lead' ? 'Lead' : 'Centre')}</div></div>
            <button class="qa-btn" onclick="removeRouteStop(${i})">Remove</button>
          </div>`).join('') : `<div class="note-line">No stops added yet.</div>`}

        ${routeDraftPreview?.itinerary ? `
        <div class="section-title">Rough Draft</div>
        <div class="field-hint" style="margin-bottom:6px">A preview of today's route so far — nothing's saved yet. Tap Build My Route below once you're happy with it.</div>
        ${itineraryBlocksHtml(routeDraftPreview.itinerary.blocks)}
        ` : ''}

        ${refCoords.length ? (suggested.length ? `
        <div class="section-title">Suggested Stops</div>
        ${suggested.map(item => `
          <div class="card" onclick="addRouteStop('centre','${item.centre.centreKey}')">
            <div class="name">${escHtml(item.centre.name)}</div>
            <div class="sub">${escHtml(item.centre.suburb || '')}${item.centre.state ? ', ' + escHtml(item.centre.state) : ''} · ${isDetourMode ? `adds ~${Math.max(0, item._distanceKm).toFixed(1)} km` : `${item._distanceKm.toFixed(1)} km away`}</div>
            <div class="why">${escHtml(item.reason)}</div>
          </div>`).join('')}
        ` : '') : `
        <div class="section-title">Suggested Stops</div>
        <div class="note-line">Enter your starting address above to see suggested stops near your route.</div>
        `}

        <label>Add a stop — search leads/centres</label>
        <input type="text" class="search-box" id="routeStopSearch" placeholder="Search by name or suburb…" value="${escHtml(rawStopSearch)}" oninput="repaintKeepingFocus(paintPlanRoute)">
        ${matches.length ? matches.map(m => `
          <div class="card" onclick="addRouteStop('${m.type}','${m.id}')">
            <div class="name">${escHtml(m.label)}</div>
            <div class="sub">${m.type === 'lead' ? 'Lead' : 'Centre'}</div>
          </div>`).join('') : ''}
        <button class="btn btn-secondary" style="width:100%;margin-top:8px" onclick="setView('route-stop-picker')">Browse Centres &amp; Leads</button>

        <label>Or enter an address/suburb manually <span class="optional">(optional)</span></label>
        <div style="display:flex;gap:8px;position:relative">
          <input type="text" id="routeManualInput" placeholder="e.g. 42 Smith St, Preston VIC" oninput="onAddressAutocompleteInput('routeManualInput','routeManualSuggestions')" onblur="setTimeout(()=>document.getElementById('routeManualSuggestions').innerHTML='',150)">
          <button class="btn btn-secondary" style="flex:0 0 auto" onclick="addManualRouteStop()">Add</button>
          <div id="routeManualSuggestions" class="autocomplete-dropdown"></div>
        </div>

        <button class="btn btn-primary" style="width:100%;margin-top:18px" onclick="buildMobileRoute()" ${routeBuilderStops.length ? '' : 'disabled'}>Build My Route</button>
      `;
    }

    // Full browse-and-pick list for adding stops — "add a button on there
    // to View which centres and leads they want to add" (Joy, 2026-09-06),
    // since the search box only ever shows anything once you've typed a
    // query. Styled like the plain Leads/Centres tabs on purpose. Reached
    // only via the "Browse Centres & Leads" button (not the bottom nav),
    // and — since the header back arrow was removed 2026-09-06 — needs its
    // own explicit way out: tapping a card both adds the stop AND returns
    // to Plan Route in one tap, and a plain "Done" button covers leaving
    // without picking anything.
    // Same priority hierarchy Suggested Stops/Today's Needs Attention
    // already use for centres (tier 1/2/3 from todayBuckets), falling
    // back to health severity when a centre isn't in that list at all —
    // "if there are no needs attention for the day continue to follow the
    // initial hierarchy we have for suggested centres" (Joy, 2026-09-06).
    // Leads get the equivalent: earlier-stage leads (New/Contacted) need
    // action soonest, so they sort first.
    const CENTRE_HEALTH_PRIORITY = { needs_attention: 1, declining: 1, dormant: 1, opportunity: 2, new_activating: 2, healthy: 3, growing: 3 };
    const LEAD_STAGE_PRIORITY = { new: 1, contacted: 2, visit_scheduled: 3, visited: 4, signed: 5 };
    let routeStopPickerSearch = '';
    // Two independent bits of state per section: whether the <details> is
    // collapsed at all (Joy, 2026-09-06: "is there any way that leads and
    // centres can be collapsible"), and whether it's showing the full list
    // instead of the initial-5 ("should display around an initial list of
    // 5"). Sections start OPEN (visible) — collapsible means the WFP can
    // shrink one out of the way if they only care about the other, not
    // that everything starts hidden.
    let routeStopPickerLeadsCollapsed = false;
    let routeStopPickerCentresCollapsed = false;
    let routeStopPickerLeadsShowAll = false;
    let routeStopPickerCentresShowAll = false;
    const ROUTE_STOP_PICKER_INITIAL_COUNT = 5;
    async function renderRouteStopPicker() {
      document.getElementById('headerTitle').textContent = 'Add a Stop';
      await ensureDataLoaded();
      routeStopPickerSearch = '';
      routeStopPickerLeadsCollapsed = false;
      routeStopPickerCentresCollapsed = false;
      routeStopPickerLeadsShowAll = false;
      routeStopPickerCentresShowAll = false;
      paintRouteStopPicker();
    }
    function paintRouteStopPicker() {
      const main = document.getElementById('mainContent');
      const rawSearch = document.getElementById('routeStopPickerSearch')?.value ?? routeStopPickerSearch;
      routeStopPickerSearch = rawSearch;
      const q = rawSearch.toLowerCase().trim();
      const alreadyAdded = { lead: new Set(routeBuilderStops.filter(s => s.type === 'lead').map(s => s.id)), centre: new Set(routeBuilderStops.filter(s => s.type === 'centre').map(s => s.id)) };
      const attentionTier = new Map(todayBuckets().attention.map(item => [item.centre.centreKey, item._tier]));

      const leads = allLeads
        .filter(l => !l.closed_at && !alreadyAdded.lead.has(l.id) && (!q || (l.centre_name || '').toLowerCase().includes(q) || (l.suburb || '').toLowerCase().includes(q)))
        .sort((a, b) => (LEAD_STAGE_PRIORITY[deriveLeadStage(a)] || 9) - (LEAD_STAGE_PRIORITY[deriveLeadStage(b)] || 9));
      const centres = allCentres
        .filter(c => !alreadyAdded.centre.has(c.centreKey) && (!q || (c.name || '').toLowerCase().includes(q) || (c.suburb || '').toLowerCase().includes(q)))
        .sort((a, b) => (attentionTier.get(a.centreKey) ?? (3 + (CENTRE_HEALTH_PRIORITY[a.health] || 4))) - (attentionTier.get(b.centreKey) ?? (3 + (CENTRE_HEALTH_PRIORITY[b.health] || 4))));

      // The initial-5 truncation only makes sense browsing the full list —
      // once they've typed a search they clearly know what they're after,
      // so show every match instead of hiding results behind Show More.
      const leadsShown = (q || routeStopPickerLeadsShowAll) ? leads : leads.slice(0, ROUTE_STOP_PICKER_INITIAL_COUNT);
      const centresShown = (q || routeStopPickerCentresShowAll) ? centres : centres.slice(0, ROUTE_STOP_PICKER_INITIAL_COUNT);

      const leadRow = l => `
        <div class="card" onclick="addRouteStop('lead','${l.id}');goBack()">
          <div class="name">${escHtml(l.centre_name)}</div>
          <div class="sub">${escHtml(l.suburb || '')}${l.state ? ', ' + escHtml(l.state) : ''}</div>
        </div>`;
      const centreRow = c => `
        <div class="card" onclick="addRouteStop('centre','${c.centreKey}');goBack()">
          <div class="name">${escHtml(c.name)}</div>
          ${healthSquareHtml(c.health)}
        </div>`;

      main.innerHTML = `
        <button class="btn btn-secondary" style="width:100%;margin-bottom:12px" onclick="goBack()">Done</button>
        <input type="text" class="search-box" id="routeStopPickerSearch" placeholder="Search by name or suburb…" value="${escHtml(rawSearch)}" oninput="repaintKeepingFocus(paintRouteStopPicker)">

        <details ${routeStopPickerLeadsCollapsed && !q ? '' : 'open'} ontoggle="routeStopPickerLeadsCollapsed=!this.open">
          <summary class="section-title" style="display:list-item;cursor:pointer">Leads (${leads.length})</summary>
          ${leadsShown.length ? leadsShown.map(leadRow).join('') : `<div class="note-line">No matching leads.</div>`}
          ${!q && !routeStopPickerLeadsShowAll && leads.length > ROUTE_STOP_PICKER_INITIAL_COUNT ? `<button class="show-more-btn" onclick="routeStopPickerLeadsShowAll=true;paintRouteStopPicker()">Show ${leads.length - ROUTE_STOP_PICKER_INITIAL_COUNT} more</button>` : ''}
        </details>

        <details ${routeStopPickerCentresCollapsed && !q ? '' : 'open'} ontoggle="routeStopPickerCentresCollapsed=!this.open">
          <summary class="section-title" style="display:list-item;cursor:pointer">Centres (${centres.length})</summary>
          ${centresShown.length ? centresShown.map(centreRow).join('') : `<div class="note-line">No matching centres.</div>`}
          ${!q && !routeStopPickerCentresShowAll && centres.length > ROUTE_STOP_PICKER_INITIAL_COUNT ? `<button class="show-more-btn" onclick="routeStopPickerCentresShowAll=true;paintRouteStopPicker()">Show ${centres.length - ROUTE_STOP_PICKER_INITIAL_COUNT} more</button>` : ''}
        </details>
      `;
    }
    // Address autocomplete ("is there no auto-complete here... like
    // Google" — Joy, 2026-09-03) for the starting-address and manual-stop
    // fields, backed by services/mapboxService.js's suggestAddresses. Only
    // touches the small dropdown div directly (never re-runs
    // paintPlanRoute, which would wipe the input's focus/cursor mid-type).
    let addressAutocompleteTimer = null;
    let currentAddressSuggestions = [];
    function onAddressAutocompleteInput(inputId, dropdownId) {
      if (inputId === 'routeStartInput') {
        routeBuilderStart = document.getElementById(inputId).value;
        routeBuilderStartCoord = null; // typing again invalidates whatever was previously resolved
      }
      clearTimeout(addressAutocompleteTimer);
      const val = document.getElementById(inputId).value.trim();
      const dropdown = document.getElementById(dropdownId);
      if (val.length < 3) { dropdown.innerHTML = ''; return; }
      addressAutocompleteTimer = setTimeout(async () => {
        try {
          const res = await api('/api/route-planner/suggest-address?q=' + encodeURIComponent(val));
          currentAddressSuggestions = res.suggestions || [];
          dropdown.innerHTML = currentAddressSuggestions.length ? currentAddressSuggestions.map((s, i) => `
            <div class="autocomplete-item" onmousedown="selectAddressSuggestion('${inputId}','${dropdownId}',${i})">${escHtml(s.label)}</div>
          `).join('') : '';
        } catch { dropdown.innerHTML = ''; }
      }, 300);
    }
    // onmousedown (not onclick) above — fires before the input's onblur
    // hides the dropdown, so a tap actually registers instead of the
    // dropdown disappearing out from under it.
    function selectAddressSuggestion(inputId, dropdownId, i) {
      const s = currentAddressSuggestions[i];
      if (!s) return;
      document.getElementById(inputId).value = s.label;
      document.getElementById(dropdownId).innerHTML = '';
      if (inputId === 'routeStartInput') {
        routeBuilderStart = s.label;
        routeBuilderStartCoord = { lat: s.lat, lng: s.lng };
        paintPlanRoute(); // refresh Suggested Stops now that we know where the day starts
        refreshRouteDraftPreview();
      }
    }
    // Covers typing a full address and tabbing/tapping away without ever
    // picking a dropdown suggestion — Suggested Stops still needs a
    // coordinate to rank by, so resolve one silently in the background
    // rather than leaving the section stuck on "enter your starting
    // address" even though they just did.
    async function resolveStartCoordIfNeeded() {
      if (routeBuilderStartCoord || !routeBuilderStart.trim()) return;
      try {
        const res = await api('/api/route-planner/suggest-address?q=' + encodeURIComponent(routeBuilderStart));
        const best = res.suggestions?.[0];
        if (best && routeBuilderStart.trim()) { // still the same address, not superseded by further typing
          routeBuilderStartCoord = { lat: best.lat, lng: best.lng };
          if (viewStack[viewStack.length - 1] === 'plan-route') { paintPlanRoute(); refreshRouteDraftPreview(); }
        }
      } catch { /* best-effort — Suggested Stops just stays gated */ }
    }
    // "Allow the user to set a Home Address... always populated when they
    // enter it" — Joy, 2026-09-04. Saves whatever's currently in Starting
    // Address (resolving its coordinate first if that hasn't happened
    // yet) as this WFP's own Home Address — self-service, no admin
    // action needed. Every future fresh "Plan a Route" then defaults to
    // it (see openPlanRoute()).
    async function saveHomeAddress() {
      const addr = routeBuilderStart.trim();
      if (!addr) return toast('Enter a starting address first', 'error');
      if (!routeBuilderStartCoord) await resolveStartCoordIfNeeded();
      try {
        await api('/api/route-planner/home-address', {
          method: 'PUT',
          body: JSON.stringify({ address: addr, lat: routeBuilderStartCoord?.lat ?? null, lng: routeBuilderStartCoord?.lng ?? null })
        });
        currentUser.homeAddress = addr;
        currentUser.homeLat = routeBuilderStartCoord?.lat ?? null;
        currentUser.homeLng = routeBuilderStartCoord?.lng ?? null;
        toast('Saved as your Home Address');
        paintPlanRoute();
      } catch (e) { toast(e.message, 'error'); }
    }
    // Fills Starting Address back in from the saved Home Address — for
    // when the field is blank (an admin/Joy, who has no auto-fill of
    // their own) or currently holds something else (they typed over it
    // for a one-off start point and want to revert).
    function useHomeAddress() {
      if (!currentUser.homeAddress) return;
      routeBuilderStart = currentUser.homeAddress;
      routeBuilderStartCoord = (currentUser.homeLat != null && currentUser.homeLng != null) ? { lat: currentUser.homeLat, lng: currentUser.homeLng } : null;
      paintPlanRoute();
      if (!routeBuilderStartCoord) resolveStartCoordIfNeeded();
      else refreshRouteDraftPreview();
    }
    // Looks the label up internally by id rather than taking it as a
    // caller-supplied argument — found live 2026-09-03: a caller passing
    // a name straight into the onclick attribute (via JSON.stringify, or
    // any other inlining) breaks the instant that name contains a quote
    // character the attribute's own delimiter collides with, which is not
    // a rare edge case — real centre names ("Angle Vale Road - Edge Early
    // Learning") broke it on the very first live test. type/id are safe
    // to inline (backend-generated identifiers, never free text).
    function addRouteStop(type, id) {
      if (routeBuilderStops.length >= 10) return toast('Smart Routing supports up to 10 stops per run', 'error');
      const label = type === 'centre'
        ? (allCentres.find(c => c.centreKey === id)?.name || id)
        : (allLeads.find(l => l.id === id)?.centre_name || id);
      routeBuilderStops.push({ type, id, label });
      paintPlanRoute();
      refreshRouteDraftPreview();
    }
    function addManualRouteStop() {
      const val = document.getElementById('routeManualInput').value.trim();
      if (!val) return;
      if (routeBuilderStops.length >= 10) return toast('Smart Routing supports up to 10 stops per run', 'error');
      routeBuilderStops.push({ type: 'manual', label: val, address: val });
      paintPlanRoute();
      refreshRouteDraftPreview();
    }
    function removeRouteStop(i) {
      routeBuilderStops.splice(i, 1);
      paintPlanRoute();
      refreshRouteDraftPreview();
    }
    async function buildMobileRoute() {
      if (!routeBuilderStart.trim()) return toast('Enter a starting address', 'error');
      if (!routeBuilderStops.length) return toast('Add at least one stop', 'error');
      const targetLabel = activeWfpLabelForPlanning();
      if (!targetLabel) return toast('Pick a territory filter above before planning a route', 'error');
      const departureTime = new Date(`${routeBuilderDate}T${routeBuilderDeparture}:00`).toISOString();
      try {
        toast('Building your route…');
        const res = await api('/api/route-planner/mobile-plan', {
          method: 'POST',
          body: JSON.stringify({
            routeDate: routeBuilderDate, startAddress: routeBuilderStart, departureTime,
            stops: routeBuilderStops.map(s => s.type === 'manual' ? { type: 'manual', label: s.label, address: s.address } : { type: s.type, id: s.id }),
            wfpLabel: targetLabel
          })
        });
        if (routeBuilderDate === todayDateStr()) plannedRoute = { routeDate: res.routeDate, startAddress: routeBuilderStart, departureTime, stops: res.stops, itinerary: res.itinerary };
        // "Once route has been built there should be another button to
        // Accept or Rebuild" — Joy, 2026-09-04. Already saved (the row's
        // in wfp_planned_routes/plannedRoute above, matching how this
        // always worked) — this is a review step before treating it as
        // final, not a second save. Rebuild is just the header/goBack()
        // arrow — it pops back to Plan a Route with everything (stops,
        // start address, departure time) exactly as it was, ready to
        // adjust and Build again.
        routeReviewResult = { startAddress: routeBuilderStart, departureTime, stops: res.stops, itinerary: res.itinerary };
        setView('route-review');
      } catch (err) { toast(err.message, 'error'); }
    }
    async function renderRouteReview() {
      document.getElementById('headerTitle').textContent = 'Route Preview';
      paintRouteReview();
    }
    function paintRouteReview() {
      const main = document.getElementById('mainContent');
      const r = routeReviewResult;
      if (!r) { main.innerHTML = `<div class="empty-state">Nothing to review — try building a route again.</div>`; return; }
      const mapsUrl = routeMapsUrl(r.startAddress, r.stops);
      main.innerHTML = `
        <div class="section-title">Route Built</div>
        ${mapsUrl ? `<a class="btn btn-secondary" style="width:100%;margin-bottom:10px" href="${mapsUrl}" target="_blank" rel="noopener">View on Maps</a>` : ''}
        ${itineraryBlocksHtml(r.itinerary?.blocks)}
        <div class="action-row" style="margin-top:14px">
          <button class="btn btn-secondary" onclick="goBack()">Rebuild</button>
          <button class="btn btn-primary" onclick="acceptRoute()">Accept</button>
        </div>
      `;
    }
    function acceptRoute() {
      toast('Route accepted!');
      viewStack = ['today'];
      setView('today', false);
    }

    // Today's "Needs Attention" — deliberately narrow (Liam, 2026-09-03,
    // live on a call reviewing this exact screen: "we want to reduce what
    // we show there, because if we show everything that needs action,
    // there's like hundreds of centers that haven't had a follow-up yet").
    // Supersedes the previous broader 8-tier list (leads, dormant centres,
    // "the rest" all drop off Today entirely — Leads keeps its own tab for
    // that). Exactly 3 categories, centres only, in this priority order:
    //   1. Just got their first booking, never been visited.
    //   2. Escalated — an ops/Sofia-raised note ("you, Sofia, and your
    //      teams" should be able to escalate a centre), or the WFP's own
    //      last visit raising an issue — both are the same isEscalated
    //      signal under the hood (see services/centreHealthService.js).
    //   3. The WFP's OWN overdue follow-up on that centre — "I told
    //      Rosemarie I'd get back to her in 48 hours" — nurture.status
    //      'follow_up_overdue' already reads exactly this (the latest
    //      visit's own next_step/next_step_due_date, not a system-wide
    //      cadence), see services/centreNurtureService.js.
    function todayBuckets() {
      const attention = [];
      for (const c of allCentres) {
        if (needsFirstBookingVisit(c)) {
          attention.push({ kind: 'centre', centre: c, reason: 'Just got their first booking — needs a visit', _tier: 1 });
        } else if (c.isEscalated) {
          attention.push({ kind: 'centre', centre: c, reason: c.escalationNote ? `${c.escalationNote}` : 'Issue raised — needs attention', _tier: 2 });
        } else if (c.nurture?.status === 'follow_up_overdue') {
