<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>RawTalent HeartBeat</title>

  <link rel="manifest" href="/wfp/manifest.json">
  <meta name="theme-color" content="#0b1d3e">
  <!-- iOS Safari doesn't honor the manifest for install metadata — these
       three tags are still required for "Add to Home Screen" there. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RT HeartBeat">
  <link rel="apple-touch-icon" href="/wfp/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/wfp/icon-192.png">

  <style>
    :root {
      --navy: #0b1d3e;
      --navy-light: #132248;
      --blue: #3d6fff;
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #16213e;
      --text-muted: #6b7590;
      --border: #e2e6f0;
      --green: #15803d;
      --green-bg: #f0fdf4;
      --amber: #b45309;
      --amber-bg: #fff7ed;
      --red: #b91c1c;
      --red-bg: #fef2f2;
      --purple: #6d28d9;
      --purple-bg: #f3e8ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
    a { color: inherit; }

    /* Fixed header/bottom-nav — CLAUDE.md GPU-compositor guidance: contain
       paint on any large fixed element, explicit background, no
       backdrop-filter/will-change/translateZ anywhere in this file. */
    header {
      position: sticky; top: 0; z-index: 10;
      background: var(--navy); color: white;
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
      contain: paint; transform-style: flat;
      display: flex; align-items: center; gap: 10px;
    }
    header .back-btn {
      background: none; border: none; color: white; font-size: 20px;
      padding: 4px 8px 4px 0; cursor: pointer; line-height: 1;
    }
    header h1 { font-size: 17px; font-weight: 700; margin: 0; flex: 1; }

    main { padding: 14px 14px 24px; max-width: 560px; margin: 0 auto; }

    nav.bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      background: var(--card); border-top: 1px solid var(--border);
      display: flex; padding-bottom: env(safe-area-inset-bottom);
      contain: paint; transform-style: flat;
    }
    nav.bottom-nav button {
      flex: 1; background: none; border: none; padding: 13px 4px;
      font-size: 14px; color: var(--text-muted); cursor: pointer;
    }
    nav.bottom-nav button.active { color: var(--blue); font-weight: 700; }

    .search-box {
      width: 100%; padding: 11px 14px; border: 1px solid var(--border);
      border-radius: 10px; font-size: 15px; background: var(--card); margin-bottom: 12px;
    }
    .toggle-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13.5px; color: var(--text-muted); }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 13px 15px; margin-bottom: 10px; cursor: pointer;
    }
    .card .name { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
    .card .sub { font-size: 13px; color: var(--text-muted); }
    .card .why { font-size: 12px; color: var(--amber); margin-top: 4px; }
    .badge {
      display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px;
      border-radius: 20px; margin-top: 6px;
    }
    .badge.good { background: var(--green-bg); color: var(--green); }
    .badge.warn { background: var(--amber-bg); color: var(--amber); }
    .badge.bad { background: var(--red-bg); color: var(--red); }
    .badge.neutral { background: #eef1f8; color: var(--text-muted); }
    .badge.purple { background: var(--purple-bg); color: var(--purple); }
    .badge.inline { margin-top: 0; flex-shrink: 0; }

    .empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 14px; }
    .spinner-wrap { display: flex; justify-content: center; padding: 30px 0; }
    .spinner {
      width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--blue);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .section-title { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; margin: 18px 0 8px; }
    .stat-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .stat { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 8px; text-align: center; }
    .stat .num { font-size: 19px; font-weight: 800; color: var(--navy); }
    .stat .label { font-size: 10.5px; color: var(--text-muted); margin-top: 2px; }

    .action-row { display: flex; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
    .btn {
      flex: 1; padding: 11px 10px; border-radius: 10px; border: none; font-size: 13.5px;
      font-weight: 700; cursor: pointer; text-align: center; min-width: 90px;
      text-decoration: none; display: inline-block;
    }
    .btn-primary { background: var(--blue); color: white; }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: var(--red-bg); color: var(--red); border: 1px solid #fecaca; }
    .btn:disabled { opacity: 0.55; }

    /* Compact quick-action row on a card — Call/Directions/Log/Follow-up.
       Smaller than the full-size .btn row above, meant to sit inline on a
       list card without dominating it. */
    .quick-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .qa-btn {
      background: #eef1f8; color: var(--navy); border: none; border-radius: 8px;
      padding: 6px 9px; font-size: 11.5px; font-weight: 700; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
    }

    .educator-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .educator-row:last-child { border-bottom: none; }
    .educator-row .name { font-weight: 600; font-size: 14px; }
    .educator-row .meta { font-size: 12px; color: var(--text-muted); }
    .tag-chip { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 10px; margin-right: 4px; margin-top: 3px; }
    .tag-chip.favourite { background: #fef3c7; color: #92400e; }
    .tag-chip.known { background: #e0e7ff; color: #3730a3; }
    .icon-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px 6px; }
    .badge.inline { margin-top: 0; flex-shrink: 0; }
    .show-more-btn { background: none; border: none; color: var(--blue); font-size: 13px; font-weight: 700; padding: 8px 0 2px; cursor: pointer; }
    .note-line { font-size: 12.5px; color: var(--text-muted); padding: 8px 0; }

    label { display: block; font-size: 12.5px; font-weight: 700; color: var(--text-muted); margin: 12px 0 5px; }
    input[type=text], input[type=date], input[type=time], input[type=tel], input[type=email], select, textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px;
      font-size: 15px; background: var(--card); font-family: inherit;
    }
    textarea { min-height: 70px; resize: vertical; }
    .field-hint { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
    /* Address autocomplete dropdown (Plan a Route's starting-address/
       manual-stop fields) — absolutely positioned so it overlays whatever
       comes next in the form instead of pushing it down. */
    .autocomplete-dropdown {
      position: absolute; left: 0; right: 0; top: 100%; z-index: 5;
      background: var(--card); border: 1px solid var(--border); border-radius: 9px;
      margin-top: 2px; overflow: hidden; contain: paint; transform-style: flat;
    }
    .autocomplete-item { padding: 10px 12px; font-size: 13.5px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .autocomplete-item:last-child { border-bottom: none; }
    label .optional { font-weight: 400; text-transform: none; letter-spacing: normal; color: var(--text-muted); }

    .toast {
      position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom));
      transform: translateX(-50%); background: var(--navy); color: white; padding: 10px 18px;
      border-radius: 20px; font-size: 13.5px; z-index: 100; opacity: 0; pointer-events: none;
      transition: opacity 0.2s; contain: paint; transform-style: flat;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: var(--red); }

    /* Recorder — one shared component (Leads + Centres) */
    .recorder-box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin: 10px 0; text-align: center; }
    .recorder-status { font-size: 12.5px; color: var(--text-muted); margin-top: 6px; }
    .rec-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-right: 5px; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.3; } }
  </style>
</head>
<body>
  <header>
    <button class="back-btn" id="backBtn" style="display:none" onclick="goBack()">←</button>
    <div style="flex:1">
      <h1 id="headerTitle">Today</h1>
    </div>
  </header>

  <main id="mainContent"><div class="spinner-wrap"><div class="spinner"></div></div></main>

  <nav class="bottom-nav">
    <button id="navToday" class="active" onclick="setTab('today')">Today</button>
    <button id="navLeads" onclick="setTab('leads')">Leads</button>
    <button id="navCentres" onclick="setTab('centres')">Centres</button>
  </nav>

  <div class="toast" id="toast"></div>

  <script>
    // ── State ──────────────────────────────────────────────────────────
    let currentUser = null;
    let viewStack = ['today'];
    let allCentres = [];
    let allLeads = [];
    let dataLoadedAt = 0; // re-fetch leads/centres if it's been a while (someone else's edit, a new visit logged elsewhere)
    let currentCentreKey = null;
    let currentSnapshot = null;
    let currentLeadId = null;
    let currentLeadActivities = [];
    let currentLeadNotes = [];
    let activityTypes = { callTypes: [], visitTypes: [] };
    let wfpFilterLabel = null; // admin-only territory toggle — null = All States (see ensureDataLoaded)
    let logTarget = null; // { type: 'lead'|'centre', id, followUpOnly, prefillOutcome }
    let editingLeadId = null;
    let plannedRoute = null; // today's saved wfp_planned_routes row (or null), fetched fresh each Today load
    let routeBuilderDate = null;
    let routeBuilderStart = '';
    let routeBuilderDeparture = '';
    let routeBuilderStops = []; // [{type:'lead'|'centre', id, label} | {type:'manual', label, address}]

    function toast(msg, kind) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show' + (kind === 'error' ? ' error' : '');
      setTimeout(() => { el.className = 'toast'; }, 2400);
    }
    function escHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function api(path, opts) {
      const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      try { return new Date(iso).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }); } catch { return iso; }
    }
    function fmtTime(iso) {
      try { return new Date(iso).toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' }); } catch { return ''; }
    }
    // Straight-line distance — good enough for "nearby", not a driving ETA.
    function haversineKm(lat1, lng1, lat2, lng2) {
      const R = 6371, toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }
    function phoneLink(phone, label) {
      return phone ? `<a href="tel:${escHtml(phone)}" onclick="event.stopPropagation()">${escHtml(label || phone)}</a>` : '';
    }
    function mailtoLink(email, label) {
      return email ? `<a href="mailto:${escHtml(email)}" onclick="event.stopPropagation()">${escHtml(label || email)}</a>` : '';
    }
    // Single-stop version of admin.html's openRouteInGoogleMaps — coords
    // preferred when we have them (same reasoning: a re-geocoded address
    // string can mismatch and place the pin somewhere else entirely), a
    // free-text address as the fallback.
    function directionsUrl(lat, lng, address) {
      const dest = Number.isFinite(lat) && Number.isFinite(lng) ? `${lat},${lng}` : encodeURIComponent(address || '');
      return `https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${dest}`;
    }

    // ── Navigation ─────────────────────────────────────────────────────
    function setView(view, push = true) {
      if (push) viewStack.push(view);
      document.getElementById('backBtn').style.display = viewStack.length > 1 ? 'block' : 'none';
      document.getElementById('navToday').classList.toggle('active', view === 'today');
      document.getElementById('navLeads').classList.toggle('active', view === 'leads' || view === 'lead-detail' || view === 'create-lead' || view === 'edit-lead');
      document.getElementById('navCentres').classList.toggle('active', view === 'centres' || view === 'centre-detail');
      render(view);
    }
    function goBack() {
      if (viewStack.length > 1) viewStack.pop();
      setView(viewStack[viewStack.length - 1], false);
    }
    // Bottom-nav taps — a real bug Liam spotted live (2026-09-03): tapping
    // Today/Leads/Centres called setView(view) with its default push=true,
    // so switching tabs kept growing viewStack instead of resetting it —
    // after a bit of normal use, viewStack.length was almost always > 1,
    // showing a back arrow on top-level tabs that should never have one
    // ("they know if they're on Centres, Leads, or Today because it'll be
    // lit up down the bottom"). Resets the stack to just this tab instead.
    function setTab(view) {
      viewStack = [view];
      setView(view, false);
    }

    function render(view) {
      const main = document.getElementById('mainContent');
      main.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';
      if (view === 'today') return renderToday();
      if (view === 'leads') return renderLeadsList();
      if (view === 'lead-detail') return renderLeadDetail();
      if (view === 'create-lead') return renderLeadForm(null);
      if (view === 'edit-lead') return renderLeadForm(editingLeadId);
      if (view === 'centres') return renderCentresList();
      if (view === 'centre-detail') return renderCentreDetail();
      if (view === 'log-activity') return renderLogActivity();
      if (view === 'plan-route') return renderPlanRoute();
    }

    // ── Shared data load (Today/Leads/Centres all read the same two lists) ──
    // A real Workforce Partner (wfpLabel set) is always auto-scoped to
    // their own territory via ?mine=true — never a picker, per Joy's own
    // original spec ("should not need to select between different
    // Workforce Partners"). Only a caller with NO wfp_label (Joy herself,
    // any admin/super_admin) gets the territory toggle below, mirroring
    // ?partnerLabel= instead — same server-side filter, just an explicit
    // label instead of the caller's own.
    async function ensureDataLoaded(force) {
      if (!force && allLeads.length + allCentres.length && Date.now() - dataLoadedAt < 60000) return;
      let q = '';
      if (currentUser.wfpLabel && !currentUser.canViewAllTerritories) q = '?mine=true';
      else if (wfpFilterLabel) q = '?partnerLabel=' + encodeURIComponent(wfpFilterLabel);
      try {
        const [leads, centres] = await Promise.all([api('/api/leads' + q), api('/api/centres' + q)]);
        allLeads = leads;
        allCentres = centres;
        dataLoadedAt = Date.now();
      } catch { toast('Could not load your leads/centres', 'error'); }
    }

    // ── Territory filter (admin-facing only — see ensureDataLoaded's own
    // comment) — same 3 partners + All, same look Desktop already uses. ──
    const WFP_FILTER_OPTIONS = [
      { key: '', label: 'All States', bg: '#0b1d3e' },
      { key: 'Liam Baxter (VIC)', label: 'Liam - VIC', bg: '#2563eb' },
      { key: 'Justine Hardware (VIC)', label: 'Justine - VIC', bg: '#0d9488' },
      { key: 'Gwen Stocks (SA)', label: 'Gwen - SA', bg: '#db2777' }
    ];
    function wfpFilterBarHtml() {
      if (currentUser.wfpLabel && !currentUser.canViewAllTerritories) return '';
      return `<div style="display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px">
        ${WFP_FILTER_OPTIONS.map(o => `
          <button onclick="setWfpFilterLabel('${o.key.replace(/'/g, "\\'")}')" style="flex-shrink:0;border:none;border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;background:${o.bg};color:white;opacity:${wfpFilterLabel === o.key ? '1' : '.55'}">${escHtml(o.label)}</button>
        `).join('')}
      </div>`;
    }
    async function setWfpFilterLabel(label) {
      wfpFilterLabel = label || null;
      await ensureDataLoaded(true);
      render(viewStack[viewStack.length - 1]);
    }
    // Which territory a save/read of a mobile route plan is for — mirrors
    // ensureDataLoaded's own q logic. A real WFP (no cross-territory grant)
    // always plans their own day; Joy/Liam plan whichever territory the
    // filter bar has picked (defaulting to nothing until one is chosen).
    function activeWfpLabelForPlanning() {
      if (currentUser.wfpLabel && !currentUser.canViewAllTerritories) return currentUser.wfpLabel;
      return wfpFilterLabel || null;
    }

    // ── Lead stage (derived — no dedicated DB field, see db/schema.sql's
    // own comment on why leads only carry 3 status/date pairs) ──────────
    const LEAD_STAGE_META = {
      new: { label: 'New', cls: 'neutral' },
      contacted: { label: 'Contacted', cls: 'neutral' },
      visit_scheduled: { label: 'Visit Scheduled', cls: 'warn' },
      visited: { label: 'Visited', cls: 'warn' },
      signed: { label: 'Signed', cls: 'good' },
      closed_lost: { label: 'Closed/Lost', cls: 'bad' }
    };
    function deriveLeadStage(l) {
      if (l.closed_at && l.signed_status !== 'signed') return 'closed_lost';
      if (l.signed_status === 'signed') return 'signed';
      if (l.centre_visited_status === 'done') return 'visited';
      if (l.centre_visited_status === 'scheduled') return 'visit_scheduled';
      if (l.lead_called_status === 'done') return 'contacted';
      return 'new';
    }

    // ── Priority (Joy's 8-tier list, 2026-09-03 call follow-up) ─────────
    // Tier 1 of Today's "Needs Attention" list — a centre that just
    // converted its first booking and has never been visited. Didn't exist
    // anywhere in the app before ("I don't have that yet. Let me add
    // that." — Joy, on an earlier call); derived entirely from fields
    // GET /api/centres already returns, no schema/backend change.
    function needsFirstBookingVisit(c) {
      return c.bookings90dCount === 1 && !c.nurture?.lastContactDate;
    }

    // ── Today ──────────────────────────────────────────────────────────
    let todaySearchVal = '';
    function todayDateStr(d) {
      const dt = d || new Date();
      return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
    }
    async function renderToday() {
      document.getElementById('headerTitle').textContent = 'Today';
      await ensureDataLoaded();
      plannedRoute = null;
      const targetLabel = activeWfpLabelForPlanning();
      if (targetLabel) {
        try {
          const q = '?date=' + todayDateStr() + '&wfpLabel=' + encodeURIComponent(targetLabel);
          const res = await api('/api/route-planner/mobile-plan' + q);
          plannedRoute = res.plan;
        } catch { plannedRoute = null; }
      }
      paintToday();
    }

    // Leads/centres within ~5km of any stop in today's planned route — the
    // route-based "nearby" Joy asked for, replacing live-GPS nearby when a
    // route exists (a route stop's location is a much stronger "you'll be
    // near this" signal than the WFP's current live position, which mostly
    // just reflects wherever they happened to open the app).
    function itemsAlongPlannedRoute() {
      if (!plannedRoute?.stops?.length) return [];
      const routeStops = plannedRoute.stops.filter(s => Number.isFinite(s.latitude) && Number.isFinite(s.longitude));
      if (!routeStops.length) return [];
      const routeStopIds = new Set(plannedRoute.stops.map(s => s.id));
      const candidates = [
        ...allLeads.filter(l => !l.closed_at && !routeStopIds.has(l.id) && Number.isFinite(l.latitude)).map(l => ({ kind: 'lead', lead: l, label: l.centre_name })),
        ...allCentres.filter(c => !routeStopIds.has(c.centreKey) && Number.isFinite(c.latitude)).map(c => ({ kind: 'centre', centre: c }))
      ];
      return candidates
        .map(item => {
          const obj = item.kind === 'lead' ? item.lead : item.centre;
          const dist = Math.min(...routeStops.map(s => haversineKm(obj.latitude, obj.longitude, s.latitude, s.longitude)));
          return { ...item, _alongRoute: true, _distanceKm: dist };
        })
        .filter(item => item._distanceKm <= 5)
        .sort((a, b) => a._distanceKm - b._distanceKm)
        .slice(0, 10);
    }

    // ── Plan a Route ─────────────────────────────────────────────────
    // "They should just be able to enter a starting address and either
    // select a centre for their destination, select a lead, or enter an
    // address/suburb manually. Don't make it complicated." — Joy, verbatim.
    function openPlanRoute() {
      routeBuilderDate = todayDateStr();
      routeBuilderStart = '';
      routeBuilderDeparture = '09:00';
      routeBuilderStops = (plannedRoute?.stops || []).map(s => ({
        type: s.type, id: s.type !== 'manual' ? s.id : undefined, label: s.centre_name, address: s.type === 'manual' ? s.centre_name : undefined
      }));
      routeBuilderStart = plannedRoute?.startAddress || '';
      setView('plan-route');
    }
    async function renderPlanRoute() {
      document.getElementById('headerTitle').textContent = 'Plan Route';
      await ensureDataLoaded();
      paintPlanRoute();
    }
    function paintPlanRoute() {
      const main = document.getElementById('mainContent');
      const q = (document.getElementById('routeStopSearch')?.value || '').toLowerCase().trim();
      const matches = q ? [
        ...allLeads.filter(l => !l.closed_at && !routeBuilderStops.some(s => s.type === 'lead' && s.id === l.id) && ((l.centre_name || '').toLowerCase().includes(q) || (l.suburb || '').toLowerCase().includes(q))).slice(0, 6).map(l => ({ type: 'lead', id: l.id, label: l.centre_name + (l.suburb ? ' — ' + l.suburb : '') })),
        ...allCentres.filter(c => !routeBuilderStops.some(s => s.type === 'centre' && s.id === c.centreKey) && ((c.name || '').toLowerCase().includes(q) || (c.suburb || '').toLowerCase().includes(q))).slice(0, 6).map(c => ({ type: 'centre', id: c.centreKey, label: c.name + (c.suburb ? ' — ' + c.suburb : '') }))
      ] : [];
      // "Why do they have to manually add stops when the goal is to build
      // the route" — Joy, 2026-09-03. The obvious candidates (Today's own
      // Needs Attention centres) now show as one-tap suggestions here too,
      // so typing a search is only needed for anything else — same
      // underlying list Today itself uses (todayBuckets), just re-filtered
      // to what isn't already on the stop list.
      const suggested = todayBuckets().attention
        .filter(item => !routeBuilderStops.some(s => s.type === 'centre' && s.id === item.centre.centreKey))
        .slice(0, 8);

      main.innerHTML = `
        ${wfpFilterBarHtml()}
        <label>Route date</label>
        <input type="date" id="routeDateInput" value="${escHtml(routeBuilderDate)}" onchange="routeBuilderDate=this.value">
        <label>Starting address</label>
        <div style="position:relative">
          <input type="text" id="routeStartInput" placeholder="Where are you starting from?" value="${escHtml(routeBuilderStart)}" oninput="onAddressAutocompleteInput('routeStartInput','routeStartSuggestions')" onblur="setTimeout(()=>document.getElementById('routeStartSuggestions').innerHTML='',150)">
          <div id="routeStartSuggestions" class="autocomplete-dropdown"></div>
        </div>
        <label>Departure time</label>
        <input type="time" id="routeDepartureInput" value="${escHtml(routeBuilderDeparture)}" onchange="routeBuilderDeparture=this.value">

        <div class="section-title">Stops (${routeBuilderStops.length}/${10})</div>
        <div class="field-hint" style="margin-bottom:8px">🎯 Aim for around 5 quality stops — a guideline, not a rule.</div>
        ${routeBuilderStops.length ? routeBuilderStops.map((s, i) => `
          <div class="card" style="cursor:default;display:flex;justify-content:space-between;align-items:center;gap:8px">
            <div><div class="name">${escHtml(s.label)}</div><div class="sub">${s.type === 'manual' ? 'Manual address' : (s.type === 'lead' ? 'Lead' : 'Centre')}</div></div>
            <button class="icon-btn" onclick="removeRouteStop(${i})">🗑️</button>
          </div>`).join('') : `<div class="note-line">No stops added yet.</div>`}

        ${suggested.length ? `
        <div class="section-title">Suggested Stops</div>
        ${suggested.map(item => `
          <div class="card" onclick="addRouteStop('centre','${item.centre.centreKey}')">
            <div class="name">${escHtml(item.centre.name)}</div>
            <div class="sub">${escHtml(item.centre.suburb || '')}${item.centre.state ? ', ' + escHtml(item.centre.state) : ''}</div>
            <div class="why">⚠️ ${escHtml(item.reason)}</div>
          </div>`).join('')}
        ` : ''}

        <label>Add a stop — search leads/centres</label>
        <input type="text" class="search-box" id="routeStopSearch" placeholder="Search by name or suburb…" oninput="paintPlanRoute()">
        ${matches.length ? matches.map(m => `
          <div class="card" onclick="addRouteStop('${m.type}','${m.id}')">
            <div class="name">${escHtml(m.label)}</div>
            <div class="sub">${m.type === 'lead' ? 'Lead' : 'Centre'}</div>
          </div>`).join('') : ''}

        <label>Or enter an address/suburb manually <span class="optional">(optional)</span></label>
        <div style="display:flex;gap:8px;position:relative">
          <input type="text" id="routeManualInput" placeholder="e.g. 42 Smith St, Preston VIC" oninput="onAddressAutocompleteInput('routeManualInput','routeManualSuggestions')" onblur="setTimeout(()=>document.getElementById('routeManualSuggestions').innerHTML='',150)">
          <button class="btn btn-secondary" style="flex:0 0 auto" onclick="addManualRouteStop()">Add</button>
          <div id="routeManualSuggestions" class="autocomplete-dropdown"></div>
        </div>

        <button class="btn btn-primary" style="width:100%;margin-top:18px" onclick="buildMobileRoute()" ${routeBuilderStops.length ? '' : 'disabled'}>🗺️ Build My Route</button>
      `;
    }
    // Address autocomplete ("is there no auto-complete here... like
    // Google" — Joy, 2026-09-03) for the starting-address and manual-stop
    // fields, backed by services/mapboxService.js's suggestAddresses. Only
    // touches the small dropdown div directly (never re-runs
    // paintPlanRoute, which would wipe the input's focus/cursor mid-type).
    let addressAutocompleteTimer = null;
    let currentAddressSuggestions = [];
    function onAddressAutocompleteInput(inputId, dropdownId) {
      if (inputId === 'routeStartInput') routeBuilderStart = document.getElementById(inputId).value;
      clearTimeout(addressAutocompleteTimer);
      const val = document.getElementById(inputId).value.trim();
      const dropdown = document.getElementById(dropdownId);
      if (val.length < 3) { dropdown.innerHTML = ''; return; }
      addressAutocompleteTimer = setTimeout(async () => {
        try {
          const res = await api('/api/route-planner/suggest-address?q=' + encodeURIComponent(val));
          currentAddressSuggestions = res.suggestions || [];
          dropdown.innerHTML = currentAddressSuggestions.length ? currentAddressSuggestions.map((s, i) => `
            <div class="autocomplete-item" onmousedown="selectAddressSuggestion('${inputId}','${dropdownId}',${i})">${escHtml(s.label)}</div>
          `).join('') : '';
        } catch { dropdown.innerHTML = ''; }
      }, 300);
    }
    // onmousedown (not onclick) above — fires before the input's onblur
    // hides the dropdown, so a tap actually registers instead of the
    // dropdown disappearing out from under it.
    function selectAddressSuggestion(inputId, dropdownId, i) {
      const label = currentAddressSuggestions[i]?.label;
      if (!label) return;
      document.getElementById(inputId).value = label;
      if (inputId === 'routeStartInput') routeBuilderStart = label;
      document.getElementById(dropdownId).innerHTML = '';
    }
    // Looks the label up internally by id rather than taking it as a
    // caller-supplied argument — found live 2026-09-03: a caller passing
    // a name straight into the onclick attribute (via JSON.stringify, or
    // any other inlining) breaks the instant that name contains a quote
    // character the attribute's own delimiter collides with, which is not
    // a rare edge case — real centre names ("Angle Vale Road - Edge Early
    // Learning") broke it on the very first live test. type/id are safe
    // to inline (backend-generated identifiers, never free text).
    function addRouteStop(type, id) {
      if (routeBuilderStops.length >= 10) return toast('Smart Routing supports up to 10 stops per run', 'error');
      const label = type === 'centre'
        ? (allCentres.find(c => c.centreKey === id)?.name || id)
        : (allLeads.find(l => l.id === id)?.centre_name || id);
      routeBuilderStops.push({ type, id, label });
      paintPlanRoute();
    }
    function addManualRouteStop() {
      const val = document.getElementById('routeManualInput').value.trim();
      if (!val) return;
      if (routeBuilderStops.length >= 10) return toast('Smart Routing supports up to 10 stops per run', 'error');
      routeBuilderStops.push({ type: 'manual', label: val, address: val });
      paintPlanRoute();
    }
    function removeRouteStop(i) {
      routeBuilderStops.splice(i, 1);
      paintPlanRoute();
    }
    async function buildMobileRoute() {
      if (!routeBuilderStart.trim()) return toast('Enter a starting address', 'error');
      if (!routeBuilderStops.length) return toast('Add at least one stop', 'error');
      const targetLabel = activeWfpLabelForPlanning();
      if (!targetLabel) return toast('Pick a territory filter above before planning a route', 'error');
      const departureTime = new Date(`${routeBuilderDate}T${routeBuilderDeparture}:00`).toISOString();
      try {
        toast('Building your route…');
        const res = await api('/api/route-planner/mobile-plan', {
          method: 'POST',
          body: JSON.stringify({
            routeDate: routeBuilderDate, startAddress: routeBuilderStart, departureTime,
            stops: routeBuilderStops.map(s => s.type === 'manual' ? { type: 'manual', label: s.label, address: s.address } : { type: s.type, id: s.id }),
            wfpLabel: targetLabel
          })
        });
        if (routeBuilderDate === todayDateStr()) plannedRoute = { routeDate: res.routeDate, startAddress: routeBuilderStart, departureTime, stops: res.stops, itinerary: res.itinerary };
        toast('Route built!');
        viewStack = ['today'];
        setView('today', false);
      } catch (err) { toast(err.message, 'error'); }
    }

    // Today's "Needs Attention" — deliberately narrow (Liam, 2026-09-03,
    // live on a call reviewing this exact screen: "we want to reduce what
    // we show there, because if we show everything that needs action,
    // there's like hundreds of centers that haven't had a follow-up yet").
    // Supersedes the previous broader 8-tier list (leads, dormant centres,
    // "the rest" all drop off Today entirely — Leads keeps its own tab for
    // that). Exactly 3 categories, centres only, in this priority order:
    //   1. Just got their first booking, never been visited.
    //   2. Escalated — an ops/Sofia-raised note ("you, Sofia, and your
    //      teams" should be able to escalate a centre), or the WFP's own
    //      last visit raising an issue — both are the same isEscalated
    //      signal under the hood (see services/centreHealthService.js).
    //   3. The WFP's OWN overdue follow-up on that centre — "I told
    //      Rosemarie I'd get back to her in 48 hours" — nurture.status
    //      'follow_up_overdue' already reads exactly this (the latest
    //      visit's own next_step/next_step_due_date, not a system-wide
    //      cadence), see services/centreNurtureService.js.
    function todayBuckets() {
      const attention = [];
      for (const c of allCentres) {
        if (needsFirstBookingVisit(c)) {
          attention.push({ kind: 'centre', centre: c, reason: '🎉 Just got their first booking — needs a visit', _tier: 1 });
        } else if (c.isEscalated) {
          attention.push({ kind: 'centre', centre: c, reason: c.escalationNote ? `🚨 ${c.escalationNote}` : '🚨 Issue raised — needs attention', _tier: 2 });
        } else if (c.nurture?.status === 'follow_up_overdue') {
          attention.push({ kind: 'centre', centre: c, reason: `Your follow-up was due ${fmtDate(c.nurture.dueDate)}`, _tier: 3 });
        }
      }
      attention.sort((a, b) => a._tier - b._tier);
      return { attention };
    }

    function todayItemRow(item) {
      if (item.kind === 'lead') {
        const l = item.lead;
        return `
          <div class="card" onclick="openLead('${l.id}')">
            <div class="name">${escHtml(item.label)}</div>
            <div class="sub">${escHtml(l.suburb || '')}${l.state ? ', ' + escHtml(l.state) : ''}${item.when ? ' · ' + fmtDate(item.when) : ''}</div>
            ${quickActionsHtml('lead', l)}
          </div>`;
      }
      const c = item.centre;
      return `
        <div class="card" onclick="openCentre('${c.centreKey}')">
          <div class="name">${escHtml(item.label || c.name)}</div>
          <div class="sub">${escHtml(c.suburb || '')}${c.state ? ', ' + escHtml(c.state) : ''}</div>
          ${item.reason ? `<div class="why">⚠️ ${escHtml(item.reason)}</div>` : ''}
          ${quickActionsHtml('centre', c)}
        </div>`;
    }

    // Call/Directions/Log activity/Create follow-up — the 4 quick actions
    // Joy asked for on every Today item. `stopPropagation` on each so
    // tapping an action doesn't also trigger the card's own onclick (open
    // detail). Call is omitted for a centre/lead with no phone on file.
    function quickActionsHtml(type, obj) {
      const phone = type === 'lead' ? obj.centre_phone : obj.contactNo;
      const id = type === 'lead' ? obj.id : obj.centreKey;
      // Directions dropped from Today's cards — Liam, 2026-09-03: "call and
      // log and follow up, but I don't think we need directions" — still
      // present on the Route section's own per-stop actions and on Centre/
      // Lead Detail, just not repeated on every Needs-Attention/Along-Your-
      // Route card here.
      return `
        <div class="quick-actions">
          ${phone ? `<a class="qa-btn" href="tel:${escHtml(phone)}" onclick="event.stopPropagation()">📞 Call</a>` : ''}
          <button class="qa-btn" onclick="event.stopPropagation();openLogActivityFor('${type}','${id}')">📝 Log</button>
          <button class="qa-btn" onclick="event.stopPropagation();openLogActivityFor('${type}','${id}',{followUpOnly:true})">⏭️ Follow-up</button>
        </div>`;
    }

    // "Your Route Today" — the planned-route block at the top of Today
    // when one exists for the day, built from the exact itinerary shape
    // routes/routePlanner.js's computeOptimizedItinerary returns
    // (blocks: drive/lunch/visit). Falls through to a "Plan a Route"
    // prompt when nothing's been built for today yet.
    function routeTodayHtml() {
      if (!plannedRoute) {
        return `
          <div class="card" style="cursor:default">
            <div class="name">No route planned for today</div>
            <div class="sub">Build a quick route and it'll show here every morning.</div>
            <button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="openPlanRoute()">Plan Route</button>
          </div>`;
      }
      const blocks = plannedRoute.itinerary?.blocks || [];
      const rows = blocks.map(b => {
        if (b.type === 'lunch') return `<div class="note-line">🍽️ ${escHtml(b.label)} — ${fmtTime(b.start)}–${fmtTime(b.end)}</div>`;
        if (b.type === 'drive') return `<div class="note-line">🚗 ${b.minutes != null ? Math.round(b.minutes) + ' min' : 'Drive'}${b.km != null ? ' (' + b.km.toFixed(1) + ' km)' : ''} to ${escHtml(b.to)}</div>`;
        const stop = b.stop;
        const isReal = stop.type === 'lead' || stop.type === 'centre';
        const stopId = stop.type === 'lead' ? stop.id : (stop.type === 'centre' ? stop.id : null);
        const address = [stop.street_address, stop.suburb, stop.state].filter(Boolean).join(', ');
        return `
          <div class="card" style="cursor:default">
            <div class="name">${fmtTime(b.start)}–${fmtTime(b.end)} · ${escHtml(stop.centre_name)}</div>
            ${address ? `<div class="sub">${escHtml(address)}</div>` : ''}
            <div class="quick-actions">
              <a class="qa-btn" href="${directionsUrl(stop.latitude, stop.longitude, address)}" target="_blank" rel="noopener">🧭 Directions</a>
              ${isReal ? `<button class="qa-btn" onclick="openLogActivityFor('${stop.type}','${stopId}')">📝 Log</button>` : ''}
            </div>
          </div>`;
      }).join('');
      return `
        <div class="section-title">🗺️ Your Route Today</div>
        ${rows}
        <div class="action-row">
          <button class="btn btn-secondary" onclick="openPlanRoute()">Rebuild Route</button>
        </div>`;
    }

    function paintToday() {
      const main = document.getElementById('mainContent');
      const q = (document.getElementById('todaySearchInput')?.value || todaySearchVal).toLowerCase();
      todaySearchVal = q;

      if (q) {
        const matchedLeads = allLeads.filter(l => !l.closed_at && ((l.centre_name || '').toLowerCase().includes(q) || (l.suburb || '').toLowerCase().includes(q)));
        const matchedCentres = allCentres.filter(c => (c.name || '').toLowerCase().includes(q) || (c.suburb || '').toLowerCase().includes(q));
        main.innerHTML = `
          ${wfpFilterBarHtml()}
          <input type="text" class="search-box" id="todaySearchInput" placeholder="Search by centre, lead or suburb…" value="${escHtml(q)}" oninput="paintToday()" autofocus>
          <div class="section-title">Leads</div>
          ${matchedLeads.length ? matchedLeads.map(l => todayItemRow({ kind: 'lead', lead: l, label: l.centre_name })).join('') : `<div class="note-line">No matching leads.</div>`}
          <div class="section-title">Centres</div>
          ${matchedCentres.length ? matchedCentres.map(c => todayItemRow({ kind: 'centre', centre: c })).join('') : `<div class="note-line">No matching centres.</div>`}
        `;
        return;
      }

      const b = todayBuckets();
      const alongRoute = plannedRoute ? itemsAlongPlannedRoute() : [];
      main.innerHTML = `
        ${wfpFilterBarHtml()}
        <input type="text" class="search-box" id="todaySearchInput" placeholder="Search by centre, lead or suburb…" value="" oninput="paintToday()">
        ${routeTodayHtml()}
        ${b.attention.length ? `<div class="section-title">⚠️ Needs Attention (${b.attention.length})</div>${b.attention.map(todayItemRow).join('')}` : ''}
        ${alongRoute.length ? `<div class="section-title">Along Your Route</div>${alongRoute.map(todayItemRow).join('')}` : ''}
        ${!b.attention.length && !alongRoute.length ? `<div class="empty-state">Nothing needs attention right now. 🎉</div>` : ''}
      `;
    }

    // ── Leads ──────────────────────────────────────────────────────────
    async function renderLeadsList() {
      document.getElementById('headerTitle').textContent = 'Leads';
      await ensureDataLoaded();
      paintLeadsList();
    }
    function paintLeadsList() {
      const main = document.getElementById('mainContent');
      const searchVal = document.getElementById('leadSearchInput')?.value || '';
      const open = allLeads.filter(l => !l.closed_at);
      const filtered = open.filter(l => !searchVal || (l.centre_name || '').toLowerCase().includes(searchVal.toLowerCase()) || (l.suburb || '').toLowerCase().includes(searchVal.toLowerCase()));
      main.innerHTML = `
        ${wfpFilterBarHtml()}
        <input type="text" class="search-box" id="leadSearchInput" placeholder="Search leads or suburb…" value="${escHtml(searchVal)}" oninput="paintLeadsList()">
        <button class="btn btn-primary" style="width:100%;margin-bottom:12px" onclick="setView('create-lead')">Create Lead</button>
        ${filtered.length ? filtered.map(l => {
          const stage = LEAD_STAGE_META[deriveLeadStage(l)];
          return `
          <div class="card" onclick="openLead('${l.id}')">
            <div class="name">${escHtml(l.centre_name)}</div>
            <div class="sub">${escHtml(l.suburb || '')}${l.state ? ', ' + escHtml(l.state) : ''}</div>
            <span class="badge ${stage.cls}">${escHtml(stage.label)}</span>
          </div>`;
        }).join('') : `<div class="empty-state">No leads found.</div>`}
      `;
    }
    function openLead(id) {
      currentLeadId = id;
      setView('lead-detail');
    }
    async function renderLeadDetail() {
      const lead = allLeads.find(l => l.id === currentLeadId);
      if (!lead) { toast('Lead not found', 'error'); return goBack(); }
      document.getElementById('headerTitle').textContent = lead.centre_name;
      try {
        const [activities, notes] = await Promise.all([
          api(`/api/leads/${currentLeadId}/activities`),
          api(`/api/leads/${currentLeadId}/notes`)
        ]);
        currentLeadActivities = activities;
        currentLeadNotes = notes;
      } catch { currentLeadActivities = []; currentLeadNotes = []; }
      paintLeadDetail();
    }
    function paintLeadDetail() {
      const l = allLeads.find(x => x.id === currentLeadId);
      const main = document.getElementById('mainContent');
      if (!l) { main.innerHTML = `<div class="empty-state">This lead could not be loaded.</div>`; return; }
      const stage = LEAD_STAGE_META[deriveLeadStage(l)];
      const contactName = [l.contact_first_name, l.contact_last_name].filter(Boolean).join(' ');
      const lastActivity = currentLeadActivities[0];
      const lastNote = currentLeadNotes[currentLeadNotes.length - 1]; // lead_notes is oldest-first
      const nextFollowUp = currentLeadActivities.find(a => a.next_step && a.next_step_due_date);

      main.innerHTML = `
        <span class="badge ${stage.cls}">${escHtml(stage.label)}</span>
        <div class="sub" style="margin-top:6px">${escHtml(l.street_address || '')}${l.street_address ? ', ' : ''}${escHtml(l.suburb || '')} ${escHtml(l.state || '')}</div>
        ${contactName || l.position ? `<div class="sub">${escHtml(contactName || '')}${contactName && l.position ? ' · ' : ''}${escHtml(l.position || '')}</div>` : ''}
        <div class="sub">${phoneLink(l.centre_phone)}${l.centre_phone && l.contact_email ? ' · ' : ''}${mailtoLink(l.contact_email)}</div>
        <div class="sub" style="margin-top:4px">${l.agency_usage ? escHtml((LEAD_AGENCY_USAGE_LABELS[l.agency_usage] || l.agency_usage)) : ''}${l.agency_usage && l.entry_type ? ' · ' : ''}${l.entry_type === 'centre' ? 'Added directly' : 'From vetting call'}</div>

        <div class="action-row">
          <a class="btn btn-secondary" href="${directionsUrl(l.latitude, l.longitude, [l.street_address, l.suburb, l.state].filter(Boolean).join(', '))}" target="_blank" rel="noopener">🧭 Directions</a>
          <button class="btn btn-secondary" onclick="openEditLead('${l.id}')">✏️ Edit</button>
        </div>
        <div class="action-row">
          <button class="btn btn-primary" onclick="openLogActivityFor('lead','${l.id}',{channel:'call'})">📞 Log Call</button>
          <button class="btn btn-primary" onclick="openLogActivityFor('lead','${l.id}',{channel:'visit'})">🚗 Log Visit</button>
        </div>
        <div class="action-row">
          <button class="btn btn-secondary" onclick="openLogActivityFor('lead','${l.id}',{followUpOnly:true})">⏭️ Create Follow-up</button>
        </div>

        <div class="section-title">Update Stage</div>
        <select id="stagePicker" onchange="applyLeadStage(this.value)">
          ${Object.entries(LEAD_STAGE_META).map(([k, v]) => `<option value="${k}" ${deriveLeadStage(l) === k ? 'selected' : ''}>${escHtml(v.label)}</option>`).join('')}
        </select>

        <div class="section-title">Last Activity</div>
        ${lastActivity ? `
          <div class="note-line">
            <strong>${lastActivity.channel === 'call' ? '📞 Call' : '🚗 Visit'}</strong> — ${fmtDate(lastActivity.created_at)}${lastActivity.contact_name ? ' with ' + escHtml(lastActivity.contact_name) : ''}<br>
            ${lastActivity.outcome ? `Outcome: ${escHtml(lastActivity.outcome)}<br>` : ''}
            ${lastActivity.notes ? escHtml(lastActivity.notes) : ''}
          </div>` : `<div class="note-line">Nothing logged yet.</div>`}

        ${nextFollowUp ? `<div class="section-title">Next Follow-up</div><div class="note-line">${escHtml(nextFollowUp.next_step)} — due ${fmtDate(nextFollowUp.next_step_due_date)}</div>` : ''}

        <div class="section-title">Most Recent Note</div>
        <div class="note-line">${lastNote ? escHtml(lastNote.note) : 'No notes yet.'}</div>

        ${l.closed_reason ? `<div class="section-title">Closed Reason</div><div class="note-line">${escHtml(l.closed_reason)}</div>` : ''}
      `;
    }

    // Update Stage picker writes back through the SAME 3 fields the rest
    // of the app uses (lead_called_status/centre_visited_status/
    // signed_status) — there's no separate "stage" column to write to, see
    // deriveLeadStage's own comment.
    async function applyLeadStage(newStage) {
      const l = allLeads.find(x => x.id === currentLeadId);
      if (!l) return;
      try {
        if (newStage === 'closed_lost') {
          const reason = prompt('Why is this lead being closed as lost?') || '';
          await api(`/api/leads/${l.id}/closed`, { method: 'PATCH', body: JSON.stringify({ closed: true, reason }) });
        } else {
          const body = {};
          if (newStage === 'new') { body.leadCalledStatus = 'to_schedule'; }
          else if (newStage === 'contacted') { body.leadCalledStatus = 'done'; }
          else if (newStage === 'visit_scheduled') {
            body.leadCalledStatus = l.lead_called_status === 'to_schedule' ? 'done' : l.lead_called_status;
            body.centreVisitedStatus = 'scheduled';
            if (!l.centre_visited_at) body.centreVisitedAt = new Date().toISOString();
          } else if (newStage === 'visited') { body.centreVisitedStatus = 'done'; }
          else if (newStage === 'signed') { body.signedStatus = 'signed'; }
          await api(`/api/leads/${l.id}`, { method: 'PUT', body: JSON.stringify(body) });
        }
        toast('Stage updated');
        await ensureDataLoaded(true);
        paintLeadDetail();
      } catch (e) { toast(e.message, 'error'); paintLeadDetail(); }
    }

    // ── Create / Edit Lead ────────────────────────────────────────────
    // A workforce_partner can only edit contact/position/status fields —
    // never centre_name/address/phone/agency_usage/assignment (routes/

          const streetAddress = document.getElementById('lfStreetAddress').value.trim();
          const centrePhone = document.getElementById('lfCentrePhone').value.trim();
          const agencyUsage = document.getElementById('lfAgencyUsage').value;
          if (!centreName || !streetAddress || !centrePhone || !agencyUsage) { toast('Centre name, address, phone and agency usage are required', 'error'); btn.disabled = false; return; }

            suburb: document.getElementById('lfSuburb').value.trim() || null,
            state: document.getElementById('lfState').value || null,
            position: document.getElementById('lfPosition').value || null,
            contactFirstName: document.getElementById('lfContactFirstName').value.trim() || null,
            contactLastName: document.getElementById('lfContactLastName').value.trim() || null,
            contactEmail: document.getElementById('lfContactEmail').value.trim() || null
          };
          await api('/api/leads', { method: 'POST', body: JSON.stringify(body) });
          toast('Lead created');

    async function tagEducator(userId, name) {
      const choice = prompt(`Tag ${name} as:\n1 = ⭐ Favourite\n2 = 🔗 Known to Centre (market intelligence)\n\nType 1 or 2:`);
      if (choice !== '1' && choice !== '2') return;
      const relationshipType = choice === '1' ? 'favourite' : 'known_to_centre';
      const note = choice === '2' ? (prompt('Note — how do we know this? (e.g. "Centre manager mentioned she covered here via another agency")') || '') : null;
      try {
        await api(`/api/centres/${encodeURIComponent(currentCentreKey)}/educator-relationships`, {
          method: 'POST', body: JSON.stringify({ candidateUserId: userId, relationshipType, note })
        });
        toast('Saved');
        renderCentreDetail();
      } catch (e) { toast(e.message, 'error'); }
    }
    // Two real bugs found live (Joy, 2026-09-03 — tapped once, saw no
    // in-flight feedback, tapped again, got two identical Bookings tasks):
    // 1. `prompt() || ''` treated Cancel (null) exactly like OK-with-no-
    //    text (''), so hitting Cancel still filed a request.
    // 2. Nothing stopped a second tap while the first request was still in
    //    flight (prompt() itself gave no visual "this is submitting" cue).
    let requestingBooking = false;
    async function requestCentreBooking(btn) {
      if (requestingBooking) return;
      const note = prompt('What do you need booked? (optional note)');
      if (note === null) return; // Cancel — do NOT file a request
      requestingBooking = true;
      const originalLabel = btn ? btn.textContent : null;
      if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
      try {
        await api(`/api/centres/${encodeURIComponent(currentCentreKey)}/request-booking`, { method: 'POST', body: JSON.stringify({ note }) });
        toast('Request sent to the team');
      } catch (e) { toast(e.message, 'error'); }
      finally {
        requestingBooking = false;
        if (btn) { btn.disabled = false; btn.textContent = originalLabel; }
      }
    }

        <div id="laOutcomeWrap">

            <option value="concern" ${logTarget.prefillOutcome === 'concern' ? 'selected' : ''}>Concern</option>

    function paintLaActivityOptions() {
      const channel = document.getElementById('laChannel').value;

    }
    async function saveActivity() {
      const btn = document.getElementById('laSaveBtn');
      if (btn.disabled) return;
      btn.disabled = true; const original = btn.textContent; btn.textContent = 'Saving…';
      const followUpOnly = !!logTarget.followUpOnly;
      const el = id => document.getElementById(id);
      try {
        if (logTarget.type === 'lead') {
          const body = {
            channel: followUpOnly ? (logTarget.channel || 'call') : el('laChannel').value,
            contactName: !followUpOnly ? (el('laContactName').value || null) : null,
            outcome: !followUpOnly ? (el('laOutcome').value || null) : null,
            notes: !followUpOnly ? (el('laNotes').value || null) : null,
            opportunityNotes: !followUpOnly ? (el('laOpportunityNotes').value || null) : null,
            nextStep: el('laNextStep').value || null,
            nextStepDueDate: el('laNextStepDue').value || null
          };
          await api(`/api/leads/${logTarget.id}/activities`, { method: 'POST', body: JSON.stringify(body) });
        } else {
          const body = {
            visitDate: today0(),
            channel: followUpOnly ? (logTarget.channel || 'visit') : el('laChannel').value,
            activityType: (!followUpOnly && el('laActivityType')) ? el('laActivityType').value : null,
            status: followUpOnly ? 'completed' : el('laStatus').value,
            outcome: !followUpOnly ? (el('laOutcome').value || null) : null,
            contactName: !followUpOnly ? (el('laContactName').value || null) : null,
            notes: !followUpOnly ? (el('laNotes').value || null) : null,
            opportunityNotes: !followUpOnly ? (el('laOpportunityNotes').value || null) : null,
            nextStep: el('laNextStep').value || null,
            nextStepDueDate: el('laNextStepDue').value || null,
            recordingIds: pendingRecordingId ? [pendingRecordingId] : undefined
          };
          if (followUpOnly && !body.activityType) body.activityType = 'Follow-up';
          await api(`/api/centres/${encodeURIComponent(logTarget.id)}/visits`, { method: 'POST', body: JSON.stringify(body) });
        }
        toast(followUpOnly ? 'Follow-up created' : 'Logged');
        await ensureDataLoaded(true);
        goBack();
        if (logTarget.type === 'lead') renderLeadDetail(); else renderCentreDetail();
      } catch (e) { toast(e.message, 'error'); }
      finally { btn.disabled = false; btn.textContent = original; }
    }
    function today0() { return new Date().toISOString(); }

    // ── Voice notes — Liam, 2026-09-03: "it's not a standalone thing" —
    // this used to be its own action outside Log Call/Visit (a lead's
    // summary landed as a separate lead_notes entry, a centre's summary
    // just sat there with "attach it next time you log"). Now it lives
    // *inside* the Log Activity sheet itself: record → transcribe → the AI
    // summary lands straight in the open Notes field (still editable
    // before Save), exactly like Desktop's visit-log modal already works
    // (startVisitLogVoiceRecording() inside admin.html's #visitLogModal).
    // Same two existing transcription endpoints/backends, just a different
    // landing spot for the result.
    let mediaRecorder = null, voiceChunks = [], voiceTarget = null, pendingRecordingId = null;
    function pickVoiceMimeType() {
      const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
      return candidates.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
    }
    async function startVoiceNote(type, id) {
      voiceTarget = { type, id };
      const box = document.getElementById('laRecorderBox');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mimeType = pickVoiceMimeType();
        mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
        voiceChunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) voiceChunks.push(e.data); };
        mediaRecorder.onstop = () => finishVoiceNote(mediaRecorder.mimeType || mimeType || 'audio/webm');
        mediaRecorder.start();
        box.innerHTML = `<div class="recorder-box"><span class="rec-dot"></span>Recording…<div class="action-row"><button class="btn btn-danger" onclick="stopVoiceNote()">⏹ Stop</button></div></div>`;
      } catch {
        toast('Microphone access denied or unavailable', 'error');
      }
    }
    function stopVoiceNote() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    }
    async function finishVoiceNote(mimeType) {
      const box = document.getElementById('laRecorderBox');
      box.innerHTML = `<div class="recorder-box"><div class="spinner-wrap" style="padding:10px 0"><div class="spinner"></div></div><div class="recorder-status">Transcribing…</div></div>`;
      const blob = new Blob(voiceChunks, { type: mimeType });
      const ext = mimeType.includes('mp4') ? 'm4a' : 'webm';
      const form = new FormData();
      try {
        let data;
        if (voiceTarget.type === 'lead') {
          form.append('file', blob, `voice-note.${ext}`);
          const res = await fetch(`/api/leads/${voiceTarget.id}/recordings/voice-note`, { method: 'POST', body: form });
          data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Upload failed');
        } else {
          form.append('files', blob, `voice-note.${ext}`);
          const res = await fetch(`/api/centres/${encodeURIComponent(voiceTarget.id)}/recordings`, { method: 'POST', body: form });
          data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Upload failed');
          pendingRecordingId = data.recordings?.[0]?.id || null; // linked to the visit at Save time (saveActivity's recordingIds)
        }
        if (data.notesSummary) {
          const notesEl = document.getElementById('laNotes');
          if (notesEl) notesEl.value = data.notesSummary;
        }
        box.innerHTML = `<div class="recorder-box"><div class="recorder-status">✅ ${data.notesSummary ? 'Added to Notes above' : 'Saved'}</div></div>`;
      } catch (e) {
        box.innerHTML = `<div class="recorder-box"><div class="recorder-status" style="color:var(--red)">${escHtml(e.message)}</div></div>`;
      }
    }

    // Standalone Educators tab (search-by-name) removed 2026-09-03 — Liam,
    // live on a call: "what's the point of that... I think we can probably
    // take it out." What he actually wanted instead — which educators
    // have worked a given centre, how much, and whether they're
    // favourited — already existed as data (centre_educator_relationships)
    // and now shows directly on Centre Detail (see educatorRow() above).

    // Joy, 2026-09-03: "every time I make changes... we'd have to add this
    // to homepage from Safari on iPhone every time" — iOS doesn't actually
    // close a home-screen web app when you leave it, it suspends the page
    // in the background (same as backgrounding a native app). Reopening
    // the icon normally just resumes that SAME already-loaded session
    // rather than fetching whatever's currently deployed — no code change
    // ever reaches an already-installed icon on its own, no matter how
    // many times the server redeploys. Forcing a reload whenever the app
    // comes back to the foreground means every reopen always picks up the
    // latest version instead. Guarded to standalone/home-screen mode only
    // (`navigator.standalone` is iOS Safari's own flag for this; the
    // matchMedia check is the general PWA equivalent) — someone just
    // visiting /wfp in an ordinary browser tab switches tabs far more
    // often, and reloading on every tab-switch-back there would be
    // needlessly disruptive (lost scroll position, an in-progress form).
    const isStandaloneApp = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
    if (isStandaloneApp) {
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') location.reload();
      });
    }

    // ── Boot ─────────────────────────────────────────────────────────
    (async function init() {
      try {
        currentUser = await api('/auth/me');
      } catch {
        location.href = '/login.html';
        return;
      }
      // Liam, 2026-09-03 (live on a call, testing this exact screen): "when
      // a workforce partner logs in on the mobile, they should just see
      // their territory" — true even for a canViewAllTerritories account
      // (his own), which otherwise defaulted to unfiltered/"All States".
      // The picker itself still renders and is still switchable — this
      // only changes what's selected before anyone taps anything.
      if (currentUser.wfpLabel) wfpFilterLabel = currentUser.wfpLabel;
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/wfp/sw.js').catch(() => {});
      }
      render('today');
    })();
  </script>
</body>
</html>
