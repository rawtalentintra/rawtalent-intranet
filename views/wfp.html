          attention.push({ kind: 'centre', centre: c, reason: `Your follow-up was due ${fmtDate(c.nurture.dueDate)}`, _tier: 3 });
        }
      }
      attention.sort((a, b) => a._tier - b._tier);
      return { attention };
    }

    // A visit "called in advance and already confirmed" (Joy, 2026-09-06)
    // — logged (Desktop or mobile) as a Visit with Status = Planned
    // (centres.scheduledVisitDates, from routes/centres.js's
    // healthForCentre), or a lead whose own Visit Scheduled stage
    // (centre_visited_status/at) lands on this date. Independent of
    // whether it's ever been added to a built route — this is about a
    // real-world commitment someone already made, not Smart Routing's own
    // state. Used both by Today (no route built yet) and Plan Route
    // (any date on the week-strip), so it takes the target date and an
    // "already on this route" exclusion set as parameters rather than
    // assuming either screen's own state.
    function scheduledVisitItemsForDate(dateStr, excludeCentreKeys, excludeLeadIds) {
      const items = [];
      for (const c of allCentres) {
        if ((excludeCentreKeys || []).includes(c.centreKey)) continue;
        if ((c.scheduledVisitDates || []).includes(dateStr)) items.push({ kind: 'centre', centre: c });
      }
      for (const l of allLeads) {
        if ((excludeLeadIds || []).includes(l.id)) continue;
        if (!l.closed_at && l.centre_visited_status === 'scheduled' && l.centre_visited_at && todayDateStr(new Date(l.centre_visited_at)) === dateStr) items.push({ kind: 'lead', lead: l });
      }
      return items;
    }
    // Drops them straight into Plan Route with the confirmed stop already
    // added — "add how many stops? Then build a smart route based on
    // their centres and leads" (Joy, 2026-09-06). Everything after that is
    // the existing Plan Route flow (stop-count goal, Suggested Stops,
    // Build) — no separate wizard needed, this just seeds it.
    // Awaits openPlanRoute so a non-today date's existing plan (if any)
    // finishes loading BEFORE this pushes the confirmed stop on top —
    // otherwise selectRouteDate's own fetch resolving afterward would
    // overwrite routeBuilderStops and silently drop it.
    async function buildRouteAroundScheduledVisit(kind, id, dateStr) {
      await openPlanRoute(dateStr);
      const type = kind === 'lead' ? 'lead' : 'centre';
      const label = type === 'centre' ? (allCentres.find(c => c.centreKey === id)?.name || id) : (allLeads.find(l => l.id === id)?.centre_name || id);
      if (!routeBuilderStops.some(s => s.type === type && s.id === id)) routeBuilderStops.push({ type, id, label });
      paintPlanRoute();
      refreshRouteDraftPreview();
    }

    // Quick-action buttons (Call/Log/Follow-up/Add to Route) were removed
    // from these cards 2026-09-04 — Liam: "it all happens in here [the
    // detail page]... we'll keep the functionality, but it's all in here."
    // Cards are tap-to-open only now; every action still lives on Lead/
    // Centre Detail.
    function todayItemRow(item) {
      if (item.kind === 'lead') {
        const l = item.lead;
        return `
          <div class="card" onclick="openLead('${l.id}')">
            <div class="name">${escHtml(item.label)}</div>
            <div class="sub">${escHtml(l.suburb || '')}${l.state ? ', ' + escHtml(l.state) : ''}${item.when ? ' · ' + fmtDate(item.when) : ''}</div>
            <div class="card-corner-badge"><span class="badge neutral corner">Lead</span></div>
          </div>`;
      }
      const c = item.centre;
      return `
        <div class="card" onclick="openCentre('${c.centreKey}')">
          <div class="name">${escHtml(item.label || c.name)}</div>
          <div class="sub">${escHtml(c.suburb || '')}${c.state ? ', ' + escHtml(c.state) : ''}</div>
          ${item.reason ? `<div class="why">${escHtml(item.reason)}</div>` : ''}
          <div class="card-corner-badge"><span class="badge neutral corner">Centre</span></div>
        </div>`;
    }

    // "Allow to ADD... that Centre or Lead should be added to the Smart
    // Routing, and... it should SMARTLY position it as to which stop it's
    // supposed to be so as not to make mistakes or run-arounds" — Joy,
    // 2026-09-04. If a route already exists for today, this re-runs the
    // EXACT SAME resolve→optimize→persist pipeline Plan a Route's own
    // Build button uses (POST /mobile-plan), just with this one stop
    // appended to the existing list — the nearest-neighbour+2-opt
    // optimizer already in routeOptimizerService.js re-sequences ALL
    // stops (old + new) to minimise total drive time, so "smart
    // positioning" falls out of machinery that already exists rather than
    // needing new logic here. No route yet today → hands off to Plan a
    // Route with this stop pre-added instead of guessing a starting
    // address/departure time it doesn't have.
    async function addStopToRoute(type, id) {
      if (!plannedRoute) {
        openPlanRoute();
        const label = type === 'centre' ? (allCentres.find(c => c.centreKey === id)?.name || id) : (allLeads.find(l => l.id === id)?.centre_name || id);
        routeBuilderStops.push({ type, id, label });
        paintPlanRoute();
        toast('Add a starting address to build your route');
        return;
      }
      if (plannedRoute.stops.some(s => s.type === type && s.id === id)) { toast('Already on your route'); return; }
      if (plannedRoute.stops.length >= 10) { toast('Smart Routing supports up to 10 stops per run', 'error'); return; }
      const targetLabel = activeWfpLabelForPlanning();
      if (!targetLabel) { toast('Pick a territory filter above first', 'error'); return; }
      const existingStops = plannedRoute.stops.map(s => s.type === 'manual' ? { type: 'manual', label: s.centre_name, address: s.centre_name } : { type: s.type, id: s.id });
      try {
        toast('Adding to your route…');
        const res = await api('/api/route-planner/mobile-plan', {
          method: 'POST',
          body: JSON.stringify({
            routeDate: todayDateStr(), startAddress: plannedRoute.startAddress, departureTime: plannedRoute.departureTime,
            stops: [...existingStops, { type, id }], wfpLabel: targetLabel
          })
        });
        plannedRoute = { routeDate: res.routeDate, startAddress: plannedRoute.startAddress, departureTime: plannedRoute.departureTime, stops: res.stops, itinerary: res.itinerary };
        toast('Added to your route!');
        paintToday();
      } catch (err) { toast(err.message, 'error'); }
    }

    // "Your Route" — the planned-route block at the top of Today, now
    // with its own date-strip (Joy, 2026-09-06: "add the dates bar there
    // as well so that can select the specific date and look at that
    // route saved for that date"). Browsing here is pure viewing —
    // todayViewDate/todayViewWeekStart/todayViewedRoute are independent
    // of Plan Route's own identically-shaped state (see their
    // declarations) so looking at a different day never changes what
    // Plan Route itself defaults to next time it's opened. Falls through
    // to a "Plan a Route" prompt (and any already-confirmed visit for
    // whichever date is on screen) when nothing's been built for it yet.
    function routeTodayHtml() {
      const strip = `<div class="section-title">Your Route</div>` + weekStripHtml(todayViewDate, todayViewWeekStart, 'selectTodayViewDate', 'shiftTodayViewWeek');
      const isToday = todayViewDate === todayDateStr();
      const dateLabel = isToday ? 'today' : fmtDate(todayViewDate);
      if (todayViewLoading) {
        return `${strip}<div class="field-hint">Loading…</div>`;
      }
      if (!todayViewedRoute) {
        const scheduledForView = scheduledVisitItemsForDate(todayViewDate);
        return `
          ${strip}
          ${scheduledForView.map(item => {
            const name = item.kind === 'lead' ? item.lead.centre_name : item.centre.name;
            const id = item.kind === 'lead' ? item.lead.id : item.centre.centreKey;
            return `
            <div class="card" style="cursor:default">
              <div class="name">${escHtml(name)}</div>
              <div class="sub">This ${item.kind === 'lead' ? 'lead' : 'centre'} is confirmed to be visited ${dateLabel}. Want to build a route around it?</div>
              <button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="buildRouteAroundScheduledVisit('${item.kind}','${id}','${todayViewDate}')">Build Route</button>
            </div>`;
          }).join('')}
          <div class="card" style="cursor:default">
            <div class="name">No route planned for ${dateLabel}</div>
            <div class="sub">${isToday ? "Build a quick route and it'll show here every morning." : 'Build a route for this day and it\'ll show here.'}</div>
            <button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="openPlanRoute('${todayViewDate}')">Plan Route</button>
          </div>`;
      }
      // No per-stop Directions here — "that whole route should be seen on
      // their Maps app" (Joy, 2026-09-04): one "View on Maps" link for the
      // entire plotted route instead, same as the Route Preview screen.
      const mapsUrl = routeMapsUrl(todayViewedRoute.startAddress, todayViewedRoute.stops);
      return `
        ${strip}
        ${mapsUrl ? `<a class="btn btn-secondary" style="width:100%;margin-bottom:10px" href="${mapsUrl}" target="_blank" rel="noopener">View on Maps</a>` : ''}
        ${itineraryBlocksHtml(todayViewedRoute.itinerary?.blocks, { showLogButton: isToday })}
        <div class="action-row">
          <button class="btn btn-secondary" onclick="openPlanRoute('${todayViewDate}')">Rebuild Route</button>
        </div>`;
    }

    function paintToday() {
      const main = document.getElementById('mainContent');
      // Keep the ORIGINAL typed casing for the input's own value — only
      // lowercase for the actual comparison. This used to feed the
      // lowercased q straight back into value="...", so typing anything
      // with a capital letter got silently forced to lowercase out from
      // under you on the very next keystroke (found live 2026-09-04,
      // alongside the focus-loss bug repaintKeepingFocus above fixes).
      const raw = document.getElementById('todaySearchInput')?.value ?? todaySearchVal;
      todaySearchVal = raw;
      const q = raw.toLowerCase();

      if (q) {
        const matchedLeads = allLeads.filter(l => !l.closed_at && ((l.centre_name || '').toLowerCase().includes(q) || (l.suburb || '').toLowerCase().includes(q)));
        const matchedCentres = allCentres.filter(c => (c.name || '').toLowerCase().includes(q) || (c.suburb || '').toLowerCase().includes(q));
        main.innerHTML = `
          ${wfpFilterBarHtml()}
          <input type="text" class="search-box" id="todaySearchInput" placeholder="Search by centre, lead or suburb…" value="${escHtml(raw)}" oninput="repaintKeepingFocus(paintToday)" autofocus>
          <div class="section-title">Leads</div>
          ${matchedLeads.length ? matchedLeads.map(l => todayItemRow({ kind: 'lead', lead: l, label: l.centre_name })).join('') : `<div class="note-line">No matching leads.</div>`}
          <div class="section-title">Centres</div>
          ${matchedCentres.length ? matchedCentres.map(c => todayItemRow({ kind: 'centre', centre: c })).join('') : `<div class="note-line">No matching centres.</div>`}
        `;
        return;
      }

      const b = todayBuckets();
      const alongRoute = plannedRoute ? itemsAlongPlannedRoute() : [];
      main.innerHTML = `
        ${wfpFilterBarHtml()}
        <input type="text" class="search-box" id="todaySearchInput" placeholder="Search by centre, lead or suburb…" value="" oninput="repaintKeepingFocus(paintToday)">
        ${routeTodayHtml()}
        ${b.attention.length ? `<div class="section-title">Needs Attention (${b.attention.length})</div>${b.attention.map(todayItemRow).join('')}` : ''}
        ${alongRoute.length ? `<div class="section-title">Along Your Route</div>${alongRoute.map(todayItemRow).join('')}` : ''}
        ${!b.attention.length && !alongRoute.length ? `<div class="empty-state">Nothing needs attention right now.</div>` : ''}
      `;
    }

    // ── Leads ──────────────────────────────────────────────────────────
    async function renderLeadsList() {
      document.getElementById('headerTitle').textContent = '';
      await ensureDataLoaded();
      paintLeadsList();
    }
    function paintLeadsList() {
      const main = document.getElementById('mainContent');
      const searchVal = document.getElementById('leadSearchInput')?.value || '';
      const open = allLeads.filter(l => !l.closed_at);
      const filtered = open.filter(l => !searchVal || (l.centre_name || '').toLowerCase().includes(searchVal.toLowerCase()) || (l.suburb || '').toLowerCase().includes(searchVal.toLowerCase()));
      main.innerHTML = `
        ${wfpFilterBarHtml()}
        <input type="text" class="search-box" id="leadSearchInput" placeholder="Search leads or suburb…" value="${escHtml(searchVal)}" oninput="repaintKeepingFocus(paintLeadsList)">
        <button class="btn btn-primary" style="width:100%;margin-bottom:12px" onclick="setView('create-lead')">Create Lead</button>
        ${filtered.length ? filtered.map(l => {
          const stage = LEAD_STAGE_META[deriveLeadStage(l)];
          return `
          <div class="card" onclick="openLead('${l.id}')">
            <div class="name">${escHtml(l.centre_name)}</div>
            <div class="sub">${escHtml(l.suburb || '')}${l.state ? ', ' + escHtml(l.state) : ''}</div>
            <div class="card-corner-badge"><span class="badge ${stage.cls} corner">${escHtml(stage.label)}</span></div>
          </div>`;
        }).join('') : `<div class="empty-state">No leads found.</div>`}
      `;
    }
    function openLead(id) {
      currentLeadId = id;
      setView('lead-detail');
    }
    async function renderLeadDetail() {
      const lead = allLeads.find(l => l.id === currentLeadId);
      if (!lead) { toast('Lead not found', 'error'); return goBack(); }
      document.getElementById('headerTitle').textContent = lead.centre_name;
      try {
        const [activities, notes] = await Promise.all([
          api(`/api/leads/${currentLeadId}/activities`),
          api(`/api/leads/${currentLeadId}/notes`)
        ]);
        currentLeadActivities = activities;
        currentLeadNotes = notes;
      } catch { currentLeadActivities = []; currentLeadNotes = []; }
      paintLeadDetail();
    }
    function paintLeadDetail() {
      const l = allLeads.find(x => x.id === currentLeadId);
      const main = document.getElementById('mainContent');
      if (!l) { main.innerHTML = `<div class="empty-state">This lead could not be loaded.</div>`; return; }
      const stage = LEAD_STAGE_META[deriveLeadStage(l)];
      const contactName = [l.contact_first_name, l.contact_last_name].filter(Boolean).join(' ');
      const lastActivity = currentLeadActivities[0];
      const lastNote = currentLeadNotes[currentLeadNotes.length - 1]; // lead_notes is oldest-first
      const nextFollowUp = currentLeadActivities.find(a => a.next_step && a.next_step_due_date);

      main.innerHTML = `
        <div class="card" style="cursor:default">
          <div class="sub">${escHtml(l.street_address || '')}${l.street_address ? ', ' : ''}${escHtml(l.suburb || '')} ${escHtml(l.state || '')}</div>
          <div class="sub" style="margin-top:6px">${phoneLink(l.centre_phone)}${l.centre_phone && l.contact_email ? ' · ' : ''}${mailtoLink(l.contact_email)}</div>
          ${contactName || l.position ? `<div class="sub" style="margin-top:6px">${escHtml(contactName || '')}${contactName && l.position ? ' · ' : ''}${escHtml(l.position || '')}</div>` : ''}
          ${l.educator_name ? `<div class="sub" style="margin-top:6px">Educator: ${escHtml(l.educator_name)}</div>` : ''}
          <div class="sub" style="margin-top:6px">${l.agency_usage ? escHtml((LEAD_AGENCY_USAGE_LABELS[l.agency_usage] || l.agency_usage)) : ''}${l.agency_usage && l.entry_type ? ' · ' : ''}${l.entry_type === 'centre' ? 'Added directly' : 'From vetting call'}</div>
          ${lastNote ? `<div class="note-line" style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px">${escHtml(lastNote.note)}</div>` : ''}
          <div class="card-corner-badge"><span class="badge ${stage.cls} corner">${escHtml(stage.label)}</span></div>
        </div>

        <div class="action-row">
          <button class="btn btn-secondary" style="flex:none;width:100%" onclick="openEditLead('${l.id}')">Edit Contact</button>
        </div>
        <div class="action-row">
          <button class="btn btn-primary" onclick="openLogActivityFor('lead','${l.id}',{channel:'call'})">Log Call</button>
          <button class="btn btn-primary" onclick="openLogActivityFor('lead','${l.id}',{channel:'visit'})">Log Visit</button>
        </div>
        <div class="action-row">
          <button class="btn btn-secondary" style="flex:none;width:100%" onclick="addStopToRoute('lead','${l.id}')">Add to Route</button>
        </div>

        <div class="section-title">Update Stage</div>
        <select id="stagePicker" onchange="applyLeadStage(this.value)">
          ${Object.entries(LEAD_STAGE_META).map(([k, v]) => `<option value="${k}" ${deriveLeadStage(l) === k ? 'selected' : ''}>${escHtml(v.label)}</option>`).join('')}
        </select>

        <div class="section-title">Last Activity</div>
        ${lastActivity ? `
          <div class="note-line">
            <strong>${lastActivity.channel === 'call' ? 'Call' : 'Visit'}</strong> — ${fmtDate(lastActivity.created_at)}${lastActivity.contact_name ? ' with ' + escHtml(lastActivity.contact_name) : ''}<br>
            ${lastActivity.outcome ? `Outcome: ${escHtml(lastActivity.outcome)}<br>` : ''}
            ${lastActivity.notes ? escHtml(lastActivity.notes) : ''}
          </div>` : `<div class="note-line">Nothing logged yet.</div>`}

        ${nextFollowUp ? `<div class="section-title">Next Follow-up</div><div class="note-line">${escHtml(nextFollowUp.next_step)} — ${fmtDate(nextFollowUp.next_step_due_date)}</div>` : ''}

        ${l.closed_reason ? `<div class="section-title">Closed Reason</div><div class="note-line">${escHtml(l.closed_reason)}</div>` : ''}
      `;
    }

    // Update Stage picker writes back through the SAME 3 fields the rest
    // of the app uses (lead_called_status/centre_visited_status/
    // signed_status) — there's no separate "stage" column to write to, see
    // deriveLeadStage's own comment.
    async function applyLeadStage(newStage) {
      const l = allLeads.find(x => x.id === currentLeadId);
      if (!l) return;
      try {
        if (newStage === 'closed_lost') {
          const reason = prompt('Why is this lead being closed as lost?') || '';
          await api(`/api/leads/${l.id}/closed`, { method: 'PATCH', body: JSON.stringify({ closed: true, reason }) });
        } else {
          const body = {};
          if (newStage === 'new') { body.leadCalledStatus = 'to_schedule'; }
          else if (newStage === 'contacted') { body.leadCalledStatus = 'done'; }
          else if (newStage === 'visit_scheduled') {
            body.leadCalledStatus = l.lead_called_status === 'to_schedule' ? 'done' : l.lead_called_status;
            body.centreVisitedStatus = 'scheduled';
            if (!l.centre_visited_at) body.centreVisitedAt = new Date().toISOString();
          } else if (newStage === 'visited') { body.centreVisitedStatus = 'done'; }
          else if (newStage === 'signed') { body.signedStatus = 'signed'; }
          await api(`/api/leads/${l.id}`, { method: 'PUT', body: JSON.stringify(body) });
        }
        toast('Stage updated');
        await ensureDataLoaded(true);
        paintLeadDetail();
      } catch (e) { toast(e.message, 'error'); paintLeadDetail(); }
    }

    // ── Create / Edit Lead ────────────────────────────────────────────
    // A workforce_partner can only edit contact/position/status fields —
    // never centre_name/address/phone/agency_usage/assignment (routes/
    // leads.js's own WORKFORCE_PARTNER_FIELDS) — the Edit form only shows
    // what actually saves, rather than offering fields that would silently
    // no-op. Create (a brand-new lead) is a different endpoint with no such
    // restriction, so it gets the full set.
    const LEAD_POSITIONS = ['Director', 'Nominated Supervisor', 'Assistant Director / Room Leader', 'Educator', 'Office Manager', 'Other'];
    const AU_STATES = ['VIC', 'NSW', 'QLD', 'SA', 'WA', 'TAS', 'NT', 'ACT'];
    const LEAD_AGENCY_USAGE_LABELS = { target_temp: 'Target Temp', high_agency_user: 'High Agency User' };

    function openEditLead(id) {
      editingLeadId = id;
      setView('edit-lead');
    }
    function renderLeadForm(id) {
      const l = id ? allLeads.find(x => x.id === id) : null;
      document.getElementById('headerTitle').textContent = id ? 'Edit Lead' : 'Create Lead';
      const main = document.getElementById('mainContent');
      main.innerHTML = `
        ${!id ? `
        <label>Centre Name *</label>
        <input type="text" id="lfCentreName" placeholder="Centre name">
        <label>Street Address *</label>
        <input type="text" id="lfStreetAddress" placeholder="Street address">
        <div style="display:flex;gap:8px">
          <div style="flex:2"><label>Suburb</label><input type="text" id="lfSuburb"></div>
          <div style="flex:1"><label>State</label><select id="lfState">${AU_STATES.map(s => `<option value="${s}">${s}</option>`).join('')}</select></div>
        </div>
        <label>Centre Phone *</label>
        <input type="tel" id="lfCentrePhone" placeholder="Centre phone number">
        <label>Agency Usage *</label>
        <select id="lfAgencyUsage">
          <option value="">— Select —</option>
          <option value="target_temp">Target Temp</option>
          <option value="high_agency_user">High Agency User</option>
        </select>
        ` : ''}
        <label>Position</label>
        <select id="lfPosition">
          <option value="">— Select —</option>
          ${LEAD_POSITIONS.map(p => `<option value="${escHtml(p)}" ${l?.position === p ? 'selected' : ''}>${escHtml(p)}</option>`).join('')}
        </select>
        <label>Contact First Name</label>
        <input type="text" id="lfContactFirstName" value="${escHtml(l?.contact_first_name || '')}">
        <label>Contact Last Name</label>
        <input type="text" id="lfContactLastName" value="${escHtml(l?.contact_last_name || '')}">
        <label>Contact Email</label>
        <input type="email" id="lfContactEmail" value="${escHtml(l?.contact_email || '')}">
        <div class="action-row">
          <button class="btn btn-primary" id="lfSaveBtn" onclick="saveLead('${id || ''}')">Save</button>
        </div>
      `;
    }
    async function saveLead(id) {
      const btn = document.getElementById('lfSaveBtn');
      btn.disabled = true;
      try {
        if (id) {
          const body = {
            position: document.getElementById('lfPosition').value || null,
            contactFirstName: document.getElementById('lfContactFirstName').value.trim() || null,
            contactLastName: document.getElementById('lfContactLastName').value.trim() || null,
            contactEmail: document.getElementById('lfContactEmail').value.trim() || null
          };

        } else {
          const centreName = document.getElementById('lfCentreName').value.trim();
          const streetAddress = document.getElementById('lfStreetAddress').value.trim();
          const centrePhone = document.getElementById('lfCentrePhone').value.trim();
          const agencyUsage = document.getElementById('lfAgencyUsage').value;
          if (!centreName || !streetAddress || !centrePhone || !agencyUsage) { toast('Centre name, address, phone and agency usage are required', 'error'); btn.disabled = false; return; }
          const body = {
            centreName, streetAddress, centrePhone, agencyUsage,
            suburb: document.getElementById('lfSuburb').value.trim() || null,
            state: document.getElementById('lfState').value || null,
            position: document.getElementById('lfPosition').value || null,
            contactFirstName: document.getElementById('lfContactFirstName').value.trim() || null,
            contactLastName: document.getElementById('lfContactLastName').value.trim() || null,
            contactEmail: document.getElementById('lfContactEmail').value.trim() || null
          };
          await api('/api/leads', { method: 'POST', body: JSON.stringify(body) });
          toast('Lead created');
        }
        await ensureDataLoaded(true);
        goBack();
      } catch (e) { toast(e.message, 'error'); }
      finally { btn.disabled = false; }
    }

    // ── My Centres ─────────────────────────────────────────────────────

      document.getElementById('headerTitle').textContent = '';

    function paintCentresList() {

    function educatorRow(e) {

    const CENTRE_HEALTH_LABELS = {
      needs_attention: 'Needs Attention', declining: 'Declining', opportunity: 'Opportunity',
      new_activating: 'New / Activating', growing: 'Growing', healthy: 'Healthy', dormant: 'Dormant'
    };
    const HEALTH_SQUARE_CLASS = {
      healthy: 'good', growing: 'good', opportunity: 'warn',
      needs_attention: 'info', new_activating: 'warn',
      declining: 'bad', dormant: 'bad'
    };
    // Single solid-colour square, no wrapper card, no explanation text —
    // Liam, 2026-09-04: "if it's healthy, make this all just maybe one
    // square and make it a green square... I think we can get rid of the
    // explanations... on dormant, on healthy, on growing, on whatever."
    // needs_attention gets its own distinct colour (info/light-blue)

    function healthSquareHtml(health) {
      if (!health) return '';

    }

      escalated: 'Escalated — needs contact now', reactivation_candidate: 'Dormant — reactivation candidate',

    // Bookings tab (below) shows only Open/Requested/Assigned — Liam,
    // 2026-09-04: "maybe it just shows assigned and open bookings, not
    // cancelled and completed... same for upcoming." statusId 1=Open,
    // 2=Requested, 3=Assigned, 5=Completed, 6=Cancelled, 7=Failed/Unfilled
    // (see BOOKING_STATUS_LABELS in admin.html). The stat-row counts above
    // are derived from these same filtered arrays so the number and the
    // list underneath always agree.
    const OPEN_BOOKING_STATUS_IDS = new Set([1, 2, 3]);
    function paintCentreDetail() {
      const main = document.getElementById('mainContent');
      const s = currentSnapshot;
      const c = allCentres.find(x => x.centreKey === currentCentreKey);
      if (!s) { main.innerHTML = `<div class="empty-state">This centre could not be loaded.</div>`; return; }
      document.getElementById('headerTitle').textContent = s.name;
      const todayOpen = s.todayBookings.filter(b => OPEN_BOOKING_STATUS_IDS.has(b.statusId));
      const upcomingOpen = s.upcomingBookings.filter(b => OPEN_BOOKING_STATUS_IDS.has(b.statusId));
      const upcomingShown = upcomingExpanded ? upcomingOpen : upcomingOpen.slice(0, 3);
      const sortedEducators = [...s.educators].sort((a, b) => {
        const aFav = (a.relationships || []).some(r => r.type === 'favourite');
        const bFav = (b.relationships || []).some(r => r.type === 'favourite');
        return aFav === bFav ? 0 : aFav ? -1 : 1;
      });
      main.innerHTML = `
        <div class="card" style="cursor:default">
          <div class="sub" style="margin-bottom:2px">${escHtml(s.streetAddress || '')}${s.streetAddress ? ', ' : ''}${escHtml(s.suburb || '')} ${escHtml(s.state || '')}</div>
          ${c ? `
          ${healthSquareHtml(c.health)}
          ${c.isEscalated ? `<span class="badge bad" style="margin-left:6px">Outstanding Issue</span>` : ''}
          ${c.nurture ? `
          <div style="background:var(--blue-bg);border-radius:10px;padding:10px 12px;margin-top:8px">
            <div style="font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.3px">Next Action</div>
            <div class="sub" style="margin-top:2px;color:var(--text)">${escHtml(NURTURE_STATUS_LABELS[c.nurture.status] || c.nurture.status)}${c.nurture.dueDate ? ' — ' + fmtDate(c.nurture.dueDate) : ''}</div>
          </div>
          ` : ''}
          ` : ''}
        </div>

        <div class="stat-row" style="margin-top:12px">
          <div class="stat" style="text-align:left"><div class="num" style="font-size:26px">${todayOpen.length}</div><div class="label">Bookings Today</div></div>
          <div class="stat" style="text-align:left"><div class="num" style="font-size:26px">${upcomingOpen.length}</div><div class="label">Upcoming Bookings</div></div>
        </div>

        <div class="action-row">
          <button class="btn btn-secondary" style="flex:none;width:100%" onclick="messageTeam(this)">Message Team</button>
        </div>
        <div class="action-row">
          <button class="btn btn-primary" onclick="openLogActivityFor('centre','${currentCentreKey}',{channel:'call'})">Log Call</button>
          <button class="btn btn-primary" onclick="openLogActivityFor('centre','${currentCentreKey}',{channel:'visit'})">Log Visit</button>
        </div>

          <button class="btn btn-secondary" style="flex:none;width:100%" onclick="addStopToRoute('centre','${currentCentreKey}')">Add to Route</button>
        </div>

        <details style="margin-top:10px" ${centreDetailOpen.educators ? 'open' : ''} ontoggle="centreDetailOpen.educators=this.open">

          ${sortedEducators.length ? sortedEducators.map(e => educatorRow(e)).join('') : `<div class="sub">No educators with shifts here yet.</div>`}
        </details>

        <details style="margin-top:10px" ${centreDetailOpen.contacts ? 'open' : ''} ontoggle="centreDetailOpen.contacts=this.open">
          <summary class="section-title" style="display:list-item;cursor:pointer">Contacts</summary>
          <div class="note-line">${s.contactName || s.contactNo ? `${escHtml(s.contactName || 'Contact')} — ${phoneLink(s.contactNo) || 'no phone on file'}` : 'No contact on file.'}</div>
        </details>

        <details style="margin-top:10px" ${centreDetailOpen.bookings ? 'open' : ''} ontoggle="centreDetailOpen.bookings=this.open">
          <summary class="section-title" style="display:list-item;cursor:pointer">Bookings</summary>
          <div class="section-title">Today</div>

    function toggleUpcoming() {

    // Renamed from "Request Booking" (Joy, 2026-09-06) — same task-bridge
    // mechanism, now general-purpose: goes to Management, assigned to
    // (and so visible to) only Joy and Sophia, not the whole Bookings
    // queue. Two real bugs already fixed here (2026-09-03) carried over:
    // 1. `prompt() || ''` treated Cancel (null) exactly like OK-with-no-
    //    text (''), so hitting Cancel still filed a message.
    // 2. Nothing stopped a second tap while the first request was still in
    //    flight (prompt() itself gave no visual "this is submitting" cue).
    let messagingTeam = false;
    async function messageTeam(btn) {
      if (messagingTeam) return;
      const note = prompt('What would you like to tell the team?');
      if (note === null || !note.trim()) return; // Cancel, or nothing typed — do NOT send
      messagingTeam = true;
      const originalLabel = btn ? btn.textContent : null;
      if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
      try {
        await api(`/api/centres/${encodeURIComponent(currentCentreKey)}/message-team`, { method: 'POST', body: JSON.stringify({ note }) });
        toast('Message sent to the team');
      } catch (e) { toast(e.message, 'error'); }
      finally {
        messagingTeam = false;
        if (btn) { btn.disabled = false; btn.textContent = originalLabel; }
      }
    }

    // ── Log Activity (shared: Leads → lead_activities, Centres → centre_visits) ──
    // One sheet for both — Joy, 2026-09-03: leads get the same 4-part
    // post-contact prompt centres already had (who/outcome/market
    // intelligence/next step). The standalone "Create Follow-up" quick
    // launch (a `followUpOnly` narrowing of this same form) was removed
    // 2026-09-04 — it was redundant with the Next Step/Due Date fields
    // already on this full form, and kept hitting "outcome is required"
    // since it skipped Outcome but still posted status=completed.
    function openLogActivityFor(type, id, opts) {
      logTarget = { type, id, ...opts };
      setView('log-activity');
    }
    async function renderLogActivity() {
      document.getElementById('headerTitle').textContent = 'Log Activity';
      if (logTarget.type === 'centre' && !activityTypes.callTypes.length) {
        try { activityTypes = await api('/api/centres/activity-types'); } catch {}
      }
      paintLogActivity();
    }
    function paintLogActivity() {
      pendingRecordingId = null; // fresh sheet, fresh recording state
      const main = document.getElementById('mainContent');
      const isCentre = logTarget.type === 'centre';
      main.innerHTML = `
        <label>Channel</label>
        <select id="laChannel" onchange="${isCentre ? 'paintLaActivityOptions()' : ''}">
          <option value="call" ${logTarget.channel === 'call' ? 'selected' : ''}>Call</option>
          <option value="visit" ${logTarget.channel === 'visit' ? 'selected' : ''}>Visit</option>
        </select>
        ${isCentre ? `<label>Activity Type</label><select id="laActivityType"></select>` : ''}
        ${isCentre ? `
        <label>Status</label>
        <select id="laStatus" onchange="document.getElementById('laOutcomeWrap').style.display = this.value === 'completed' ? 'block' : 'none'">
          <option value="completed">Called / Visited</option>
          <option value="planned">Planned</option>
          <option value="rescheduled">Rescheduled</option>
        </select>` : `<input type="hidden" id="laStatus" value="completed">`}
        <div id="laOutcomeWrap">
          <label>Who did you speak with?</label>
          <input type="text" id="laContactName" placeholder="Contact name">
          <label>Outcome</label>
          <select id="laOutcome">
            <option value="positive" ${logTarget.prefillOutcome === 'positive' ? 'selected' : ''}>Positive</option>
            <option value="neutral" ${logTarget.prefillOutcome === 'neutral' ? 'selected' : ''}>Neutral</option>
            <option value="concern" ${logTarget.prefillOutcome === 'concern' ? 'selected' : ''}>Concern</option>
            <option value="issue_raised" ${logTarget.prefillOutcome === 'issue_raised' ? 'selected' : ''}>Issue Raised</option>
          </select>
          <label>Notes</label>
          <textarea id="laNotes" placeholder="What happened…"></textarea>
          <button type="button" class="btn btn-secondary" id="laRecordBtn" style="width:100%;margin-top:4px" onclick="startVoiceNote('${logTarget.type}','${logTarget.id}')">Record Notes</button>
          <div id="laRecorderBox"></div>
          <label>Market intelligence</label>
          <textarea id="laOpportunityNotes" placeholder="Anything worth knowing…"></textarea>
        </div>
        <label>Next step <span class="optional">(what needs to happen, and when)</span></label>
        <input type="text" id="laNextStep" placeholder="e.g. Send pricing sheet">
        <label>Due date</label>
        <input type="date" id="laNextStepDue">
        <div class="action-row">
          <button class="btn btn-secondary" onclick="goBack()">Cancel</button>
          <button class="btn btn-primary" id="laSaveBtn" onclick="saveActivity()">Save</button>
        </div>
      `;
      if (isCentre) paintLaActivityOptions();
    }
    // Mobile-only context filtering (Liam, 2026-09-04): a brand-new/
    // prospect centre should only ever see the "new centre" activity
    // types, an established one only the "mature centre" types — never
    // both mixed together. Desktop's own Log Visit modal is untouched
    // (still the full, unfiltered list from /api/centres/activity-types).
    // 'Escalation note' is deliberately excluded from both mobile buckets
    // — that's Desktop's dedicated Escalate entry point only.
    const NEW_CENTRE_VISIT_TYPES = new Set(['Prospect', 'Centre setup', 'First-booking welcome']);
    const NEW_CENTRE_CALL_TYPES = new Set(['Prospect follow-up', 'Activation support', 'First-booking follow-up']);
    function paintLaActivityOptions() {
      const channel = document.getElementById('laChannel').value;
      const allOptions = channel === 'call' ? activityTypes.callTypes : activityTypes.visitTypes;
      const newSet = channel === 'call' ? NEW_CENTRE_CALL_TYPES : NEW_CENTRE_VISIT_TYPES;
      const c = allCentres.find(x => x.centreKey === logTarget.id);
      const isNewCentre = c?.health === 'new_activating';
      const options = (allOptions || [])
        .filter(t => t !== 'Escalation note')
        .filter(t => isNewCentre ? newSet.has(t) : !newSet.has(t));
      document.getElementById('laActivityType').innerHTML = options.map(t => `<option value="${escHtml(t)}">${escHtml(t)}</option>`).join('');
    }
    async function saveActivity() {
      const btn = document.getElementById('laSaveBtn');
      if (btn.disabled) return;
      btn.disabled = true; const original = btn.textContent; btn.textContent = 'Saving…';
      const el = id => document.getElementById(id);
      try {
        if (logTarget.type === 'lead') {
          const body = {
            channel: el('laChannel').value,
            contactName: el('laContactName').value || null,
            outcome: el('laOutcome').value || null,
            notes: el('laNotes').value || null,
            opportunityNotes: el('laOpportunityNotes').value || null,
            nextStep: el('laNextStep').value || null,
            nextStepDueDate: el('laNextStepDue').value || null
          };
          await api(`/api/leads/${logTarget.id}/activities`, { method: 'POST', body: JSON.stringify(body) });
        } else {
          const body = {
            visitDate: today0(),
            channel: el('laChannel').value,
            activityType: el('laActivityType') ? el('laActivityType').value : null,
            status: el('laStatus').value,
            outcome: el('laOutcome').value || null,
            contactName: el('laContactName').value || null,
            notes: el('laNotes').value || null,
            opportunityNotes: el('laOpportunityNotes').value || null,
            nextStep: el('laNextStep').value || null,
            nextStepDueDate: el('laNextStepDue').value || null,
            recordingIds: pendingRecordingId ? [pendingRecordingId] : undefined
          };
          await api(`/api/centres/${encodeURIComponent(logTarget.id)}/visits`, { method: 'POST', body: JSON.stringify(body) });
        }
        toast('Logged');
        await ensureDataLoaded(true);
        goBack();
        if (logTarget.type === 'lead') renderLeadDetail(); else renderCentreDetail();
      } catch (e) { toast(e.message, 'error'); }
      finally { btn.disabled = false; btn.textContent = original; }
    }
    function today0() { return new Date().toISOString(); }

    // ── Voice notes — Liam, 2026-09-03: "it's not a standalone thing" —
    // this used to be its own action outside Log Call/Visit (a lead's
    // summary landed as a separate lead_notes entry, a centre's summary
    // just sat there with "attach it next time you log"). Now it lives
    // *inside* the Log Activity sheet itself: record → transcribe → the AI
    // summary lands straight in the open Notes field (still editable
    // before Save), exactly like Desktop's visit-log modal already works
    // (startVisitLogVoiceRecording() inside admin.html's #visitLogModal).
    // Same two existing transcription endpoints/backends, just a different
    // landing spot for the result.
    let mediaRecorder = null, voiceChunks = [], voiceTarget = null, pendingRecordingId = null;
    function pickVoiceMimeType() {
      const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
      return candidates.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
    }
    async function startVoiceNote(type, id) {
      voiceTarget = { type, id };
      const box = document.getElementById('laRecorderBox');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mimeType = pickVoiceMimeType();
        mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
        voiceChunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) voiceChunks.push(e.data); };
        mediaRecorder.onstop = () => finishVoiceNote(mediaRecorder.mimeType || mimeType || 'audio/webm');
        mediaRecorder.start();
        box.innerHTML = `<div class="recorder-box"><span class="rec-dot"></span>Recording…<div class="action-row"><button class="btn btn-danger" onclick="stopVoiceNote()">⏹ Stop</button></div></div>`;
      } catch {
        toast('Microphone access denied or unavailable', 'error');
      }
    }
    function stopVoiceNote() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    }
    async function finishVoiceNote(mimeType) {
      const box = document.getElementById('laRecorderBox');
      box.innerHTML = `<div class="recorder-box"><div class="spinner-wrap" style="padding:10px 0"><div class="spinner"></div></div><div class="recorder-status">Transcribing…</div></div>`;
      const blob = new Blob(voiceChunks, { type: mimeType });
      const ext = mimeType.includes('mp4') ? 'm4a' : 'webm';
      const form = new FormData();
      try {
        let data;
        if (voiceTarget.type === 'lead') {
          form.append('file', blob, `voice-note.${ext}`);
          const res = await fetch(`/api/leads/${voiceTarget.id}/recordings/voice-note`, { method: 'POST', body: form });
          data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Upload failed');
        } else {
          form.append('files', blob, `voice-note.${ext}`);
          const res = await fetch(`/api/centres/${encodeURIComponent(voiceTarget.id)}/recordings`, { method: 'POST', body: form });
          data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Upload failed');
          pendingRecordingId = data.recordings?.[0]?.id || null; // linked to the visit at Save time (saveActivity's recordingIds)
        }
        if (data.notesSummary) {
          const notesEl = document.getElementById('laNotes');
          if (notesEl) notesEl.value = data.notesSummary;
        }
        box.innerHTML = `<div class="recorder-box"><div class="recorder-status">${data.notesSummary ? 'Added to Notes above' : 'Saved'}</div></div>`;
      } catch (e) {
        box.innerHTML = `<div class="recorder-box"><div class="recorder-status" style="color:var(--red)">${escHtml(e.message)}</div></div>`;
      }
    }

    // Standalone Educators tab (search-by-name) removed 2026-09-03 — Liam,
    // live on a call: "what's the point of that... I think we can probably
    // take it out." What he actually wanted instead — which educators
    // have worked a given centre, how much, and whether they're
    // favourited — already existed as data (centre_educator_relationships)
    // and now shows directly on Centre Detail (see educatorRow() above).

    // Joy, 2026-09-03: "every time I make changes... we'd have to add this
    // to homepage from Safari on iPhone every time" — iOS doesn't actually
    // close a home-screen web app when you leave it, it suspends the page
    // in the background (same as backgrounding a native app). Reopening
    // the icon normally just resumes that SAME already-loaded session
    // rather than fetching whatever's currently deployed — no code change
    // ever reaches an already-installed icon on its own, no matter how
    // many times the server redeploys. Forcing a reload whenever the app
    // comes back to the foreground means every reopen always picks up the
    // latest version instead. Guarded to standalone/home-screen mode only
    // (`navigator.standalone` is iOS Safari's own flag for this; the
    // matchMedia check is the general PWA equivalent) — someone just
    // visiting /wfp in an ordinary browser tab switches tabs far more
    // often, and reloading on every tab-switch-back there would be
    // needlessly disruptive (lost scroll position, an in-progress form).
    const isStandaloneApp = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
    if (isStandaloneApp) {
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') location.reload();
      });
    }

    // ── Boot ─────────────────────────────────────────────────────────
    (async function init() {
      try {
        currentUser = await api('/auth/me');
      } catch {
        location.href = '/login.html';
        return;
      }
      // Liam, 2026-09-03 (live on a call, testing this exact screen): "when
      // a workforce partner logs in on the mobile, they should just see
      // their territory" — a wfp_label'd account (Liam/Justine/Gwen)
      // otherwise defaulted to unfiltered/"All States" here. For Gwen
      // (additionalTerritories set) the picker still renders across her
      // own two territories and is still switchable between them — this
      // only changes what's selected before she taps anything. Liam/
      // Justine get no picker at all (see wfpFilterOptionsForCurrentUser).
      if (currentUser.wfpLabel) wfpFilterLabel = currentUser.wfpLabel;
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/wfp/sw.js').catch(() => {});
      }
      render('today');
    })();
  </script>
</body>
</html>
